<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>POLICE DOG</title>
  <!-- 📱 iPhoneの「ホーム画面に追加」で使われる名前(titleより優先される) -->
  <meta name="apple-mobile-web-app-title" content="PoliceDog">
  <!-- 📱 iPhoneの「ホーム画面に追加」で使われるアイコン -->
  <link rel="apple-touch-icon" href="../icon.png">
  <!-- 🌐 ブラウザのタブに表示されるアイコン -->
  <link rel="icon" type="image/png" href="../icon.png">
  <!-- 📱 Brave・Android Chrome等が参照するWebアプリマニフェスト -->
  <link rel="manifest" href="../manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0f172a">
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      background-color: #0f172a;
      
      font-family: 'Courier New', Courier, monospace; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      height: 100dvh; 
      user-select: none; 
      -webkit-user-select: none; 
      overflow: hidden;
    }
    
    .game-container { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
    .game-wrapper { width: 340px; height: 680px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1); transform-origin: center center; flex-shrink: 0; }
    
    .gameboy-body { width: 100%; height: 100%; background: #cfcfc4; border-radius: 10px 10px 40px 10px; box-shadow: inset -5px -5px 0px #999, inset 5px 5px 0px #fff, 0 20px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; padding: 25px 15px; box-sizing: border-box; position: relative; }
    
    .gb-screen-border { width: 92%; height: 230px; background: #777773; border-radius: 5px 5px 25px 5px; border: 3px solid #555; display: flex; justify-content: center; align-items: center; position: relative; margin-top: 10px; }
    #gameCanvas { background: #8b956d; border: 4px solid #555; image-rendering: pixelated; }
    
    .gb-title { width: 92%; text-align: left; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: bold; color: #232323; margin-top: 10px; margin-bottom: 5px; padding-left: 6px; box-sizing: border-box; letter-spacing: -0.3px; }

    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; border-radius: 10px 10px 40px 10px;}
    
    .input-wrapper { position: relative; width: 80%; margin-bottom: 8px; display: flex; align-items: center; }
    .input-at { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #34d399; font-size: 16px; font-weight: bold; pointer-events: none; z-index: 10; }
    input[type="text"] {
      width: 100%; padding: 12px 35px; border-radius: 8px; border: 2px solid #10b981;
      background: #0f172a; color: #fff; font-size: 16px; text-align: left; box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.25);
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    input[type="text"]:focus { outline: none; border-color: #34d399; box-shadow: 0 0 22px rgba(52, 211, 153, 0.45); }
    .clear-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #ef4444; font-size: 20px; font-weight: bold; cursor: pointer; z-index: 10; }

    .remember-wrapper { width: 80%; text-align: left; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; letter-spacing: 0.2px; color: #d1fae5; }
    .remember-wrapper label { cursor: pointer; }
    .remember-wrapper input[type="checkbox"] { accent-color: #34d399; }

    .mode-buttons { display: flex; gap: 10px; width: 80%; flex-direction: column; }
    .start-btn {
      border: 2px solid transparent; padding: 14px 20px; font-size: 14px; cursor: pointer;
      border-radius: 10px; width: 100%; touch-action: manipulation;
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: 0.4px;
      background-color: #0f172a;
      color: #ffffff;
      transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
    }
    .start-btn:active { transform: translateY(2px) scale(0.99); filter: brightness(1.15); }

    .normal-btn {
      border-color: #3b82f6;
      background: linear-gradient(135deg, rgba(59,130,246,0.22) 0%, #0f172a 70%);
      box-shadow: 0 0 18px rgba(59, 130, 246, 0.35), inset 0 0 16px rgba(59, 130, 246, 0.08);
      text-shadow: 0 0 10px rgba(96, 165, 250, 0.8);
    }
    .boost-btn {
      border-color: #ef4444;
      background: linear-gradient(135deg, rgba(239,68,68,0.22) 0%, #0f172a 70%);
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.35), inset 0 0 16px rgba(239, 68, 68, 0.08);
      text-shadow: 0 0 10px rgba(248, 113, 113, 0.8);
    }
    .hell-btn {
      border-color: #b91c1c;
      background: linear-gradient(135deg, rgba(185,28,28,0.28) 0%, #0f172a 70%);
      box-shadow: 0 0 18px rgba(185, 28, 28, 0.45), inset 0 0 16px rgba(185, 28, 28, 0.12);
      text-shadow: 0 0 10px rgba(248, 113, 113, 0.8);
    }

    .start-btn.pressed { animation: startPress 0.38s ease-out both; box-shadow: 0 0 30px rgba(96, 165, 250, 0.95), inset 0 0 20px rgba(255, 255, 255, 0.35); }
    @keyframes startPress {
      0% { transform: none; filter: brightness(1); }
      20% { transform: translateY(5px) scale(0.94, 0.9); filter: brightness(1.5); }
      55% { transform: translateY(-4px) scale(1.06, 1.08); filter: brightness(1.7); }
      100% { transform: translateY(0) scale(1.02); filter: brightness(1.3); }
    }
    .dpad { position: absolute; left: 35px; bottom: 180px; width: 80px; height: 80px; cursor: pointer; z-index: 5; }
    .dpad-axis { position: absolute; background: #2b2b2b; border-radius: 3px; box-shadow: 0 4px 0 #111; }
    .dpad-h { top: 27px; left: 0; width: 80px; height: 26px; }
    .dpad-v { top: 0; left: 27px; width: 26px; height: 80px; }
    
    /* 🎯 押し損ね防止用：A/Bボタン周辺の親タップエリア */
    .gb-buttons-area { 
      position: absolute; 
      right: 15px; 
      bottom: 155px; 
      width: 140px; 
      height: 120px; 
      z-index: 5; 
      cursor: pointer;
    }
    .gb-buttons { position: absolute; right: 20px; bottom: 40px; display: flex; gap: 15px; transform: rotate(-25deg); pointer-events: none; }
    .gb-btn { width: 44px; height: 44px; background: #a32249; border-radius: 50%; box-shadow: 0 4px 0 #5c1126, inset -2px -2px 3px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.7); font-size: 14px; font-weight: bold; pointer-events: auto; }
    .gb-btn:active, .gb-btn.active { transform: translateY(4px); box-shadow: 0 0px 0 #5c1126; }

    .gb-menu { position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); display: flex; gap: 25px; z-index: 5; }
    .gb-menu-btn { width: 45px; height: 10px; background: #7b7b77; border-radius: 5px; box-shadow: 0 2px 0 #444; position: relative; cursor: pointer; }
    .gb-menu-label { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 9px; color: #555; font-weight: bold; font-family: 'Courier New', monospace; }

    .gb-speaker { position: absolute; right: 30px; bottom: 45px; width: 50px; height: 45px; display: flex; gap: 6px; transform: rotate(-28deg); }
    .gb-speaker-line { width: 4px; height: 100%; background: #9a9a91; border-radius: 2px; box-shadow: inset 1px 1px 0px rgba(0,0,0,0.2); }

    .music-btn {
      position: absolute;
      bottom: 25px;
      left: 25px;
      background: #0f172a;
      color: #64748b;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 7px 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      z-index: 300;
      box-shadow: none;
      outline: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.12s;
    }
    .music-btn.is-on {
      color: #6ee7b7;
      border-color: #34d399;
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.4), inset 0 0 10px rgba(52, 211, 153, 0.1);
    }
    .music-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    #statusMessage { position: absolute; color: #333; font-size: 11px; bottom: 20px; font-weight: bold; width: 80%; text-align: center; z-index: 200; pointer-events: none;}

    .share-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 6px;
      font-size: 0;
      cursor: pointer;
      z-index: 120;
      border-radius: 4px;
      display: none;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
      line-height: 0;
      transition: background 0.2s;
    }
    .share-btn:active {
      transform: translateY(1px);
      box-shadow: 0px 0px 0px rgba(0,0,0,0);
      background: rgba(0, 0, 0, 0.8);
    }

    /* 🌿 タイトル文字：白→エメラルドグリーンのグラデーション + ネオン風の光彩 */
    .title-glow {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(135deg, #ffffff 0%, #34d399 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(52, 211, 153, 0.3);
    }
  
    .pd-title {
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: 1px;
      margin: 0 0 6px; text-align: center;
      background: linear-gradient(135deg, #ffffff 0%, #60a5fa 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(96, 165, 250, 0.35);
    }
  </style>
</head>
<body>
<div class="game-container">
    <div id="gameWrapper" class="game-wrapper">
      <div class="gameboy-body">
        
        <button id="btnMusicToggle" class="music-btn is-on">🎵 ON</button>

        <div class="gb-screen-border">
          <canvas id="gameCanvas" width="240" height="160"></canvas>
          <button id="shareButton" class="share-btn" title="Share">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
              <polyline points="16 6 12 2 8 6"></polyline>
              <line x1="12" y1="2" x2="12" y2="15"></line>
            </svg>
          </button>
        </div>
        
        <div class="gb-title">Police Dog</div>

        <div id="statusMessage"></div>
        
        <div id="dpadControl" class="dpad">
          <div class="dpad-axis dpad-h"></div>
          <div class="dpad-axis dpad-v"></div>
        </div>
        
        <!-- 🎯 タップ判定エリアを拡張したボタンエリア構造 -->
        <div id="btnArea" class="gb-buttons-area">
          <div class="gb-buttons">
            <div id="btnB" class="gb-btn">B</div>
            <div id="btnA" class="gb-btn">A</div>
          </div>
        </div>
        
        <div class="gb-menu">
          <div id="btnSelect" class="gb-menu-btn"><span class="gb-menu-label">SELECT</span></div>
          <div id="btnStart" class="gb-menu-btn"><span class="gb-menu-label">START</span></div>
        </div>
        
        <div class="gb-speaker">
          <div class="gb-speaker-line"></div>
          <div class="gb-speaker-line"></div>
          <div class="gb-speaker-line"></div>
          <div class="gb-speaker-line"></div>
        </div>

                <div id="setupOverlay" class="overlay">
          <h1 class="pd-title">POLICE DOG</h1>
          <canvas id="titleWalkCanvas" width="200" height="50" style="image-rendering: pixelated; margin: 4px 0 8px;"></canvas>
          <div class="mode-buttons">
            <button id="btnNormal" class="start-btn normal-btn">START</button>
            <button id="btnBackSelect" class="start-btn" style="background:#334155;color:#e2e8f0;box-shadow:0 4px 0 #1e293b;font-size:12px;">&lt; BACK TO GAME SELECT</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    window.addEventListener('error', function(e) {
      const m = document.getElementById('statusMessage');
      if (m) { m.innerText = 'Error: ' + e.message; m.style.color = '#ff4444'; }
    });

    // =====================================================================
    //  POLICE DOG  (GAME CAT / GanjaCatRun 2 のボス戦スピンオフ)
    // =====================================================================
    const BGM_URL = "../iwashiro_yanagi_bocho.mp3";   // ← GCRと同じ階層構成（ゲームフォルダの1つ上＝GitHubルート）
    const BACK_URL = "../";                            // ← GAME SELECTへ戻るリンク先

    // ---------- 調整しやすい設定値 ----------
    const DOG_HP = 5;                  // ポリスドッグのライフ（レーザー命中数）
    const CAT_LIFE = 5;                // ガンジャキャットのライフ
    const GAUGE_MAX = 5;               // 避けた弾丸N発でゲージMAX
    const CHARGE_FRAMES = 26;          // 「しゃきーん！」から発射までの溜め
    const BULLET_SPEED = 5.0;          // 弾速（ずっと一定）※遅すぎるとジャンプしても着弾するので注意
    const LIFE_ROWS = 28, LIFE_MAX = 140;   // ライフゲージは28行（1行=5）
    const HIT_DMG = 28;                // 1回のダメージ＝ゲージの5分の1（5回で死亡）
    const HEAL_AMOUNT = 84;            // ハート：3段階（5分の3）回復
        const SHOT_WAIT_START = 105;       // 発射間隔（ポリスドッグのライフ満タン時, フレーム）
    const SHOT_WAIT_END = 42;          // 発射間隔（最大難度時）
    const DROP_MIN = 1200, DROP_MAX = 2400;   // パラシュート出現間隔（20〜40秒）
    const NITRO_TOTAL = 240;           // ニトロ無敵時間（4秒・原作と同じ）

    const W = 240, H = 160, GROUND = 133, CAT_X = 20, CAT_REST = 115, DOG_STAND_X = 170;
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // =====================================================================
    //  AUDIO
    // =====================================================================
    let audioCtx = null, bgmBuffer = null, bgmSource = null, bgmGain = null, bgmLoading = false;
    let leaving = false, unlockArmed = false, bgmWanted = false, isMusicOn = true, startPressed = false;
    let nitroNodes = [];

    function ensureAudioCtx() {
      if (!audioCtx) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (C) {
          audioCtx = new C();
          audioCtx.onstatechange = function() {
            if (audioCtx && audioCtx.state !== 'running' && !leaving && isMusicOn && bgmWanted && !document.hidden) armBgmUnlock();
          };
        }
      }
      return audioCtx;
    }
    function unlockAudio() {
      const c = ensureAudioCtx(); if (!c) return;
      if (c.state !== 'running') {
        try { const b = c.createBuffer(1, 1, 22050), s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) {}
        c.resume().catch(function(){});
      }
    }
    function startBgm() {
      if (!isMusicOn || leaving || !bgmWanted) return;
      const c = ensureAudioCtx(); if (!c) return;
      if (c.state !== 'running') c.resume().catch(function(){});
      if (bgmSource) return;
      if (!bgmBuffer) { preloadBgm(); return; }
      bgmSource = c.createBufferSource(); bgmSource.buffer = bgmBuffer; bgmSource.loop = true;
      bgmGain = c.createGain(); bgmGain.gain.value = paused ? 0 : 0.22;
      bgmSource.connect(bgmGain); bgmGain.connect(c.destination); bgmSource.start(0);
    }
    function stopBgm() {
      if (bgmSource) {
        try { bgmSource.stop(); } catch (e) {}
        try { bgmSource.disconnect(); } catch (e) {}
        bgmSource = null;
      }
    }
    function stopBgmAndClose() {
      leaving = true; stopBgm(); bgmLoading = false;
      const c = audioCtx; audioCtx = null;
      if (c) { try { c.onstatechange = null; const pr = c.close(); if (pr && pr.catch) pr.catch(function(){}); } catch (e) {} }
    }
    function preloadBgm() {
      if (bgmBuffer || bgmLoading || leaving) return;
      const c = ensureAudioCtx(); if (!c) return;
      bgmLoading = true;
      fetch(BGM_URL).then(function(r){ return r.arrayBuffer(); })
        .then(function(ab){ return new Promise(function(res, rej){ c.decodeAudioData(ab, res, rej); }); })
        .then(function(buf){ bgmBuffer = buf; bgmLoading = false; startBgm(); })
        .catch(function(){ bgmLoading = false; });
    }
    function bgmOn() { bgmWanted = true; startBgm(); if (!bgmSource || !audioCtx || audioCtx.state !== 'running') armBgmUnlock(); }
    function bgmOff() { bgmWanted = false; stopBgm(); }
    function armBgmUnlock() {
      if (unlockArmed || leaving) return;
      unlockArmed = true;
      const evs = ['touchend', 'pointerup', 'click', 'keydown'];
      const h = function() {
        if (leaving) return;
        unlockAudio(); startBgm();
        const c = audioCtx;
        if (c && c.state === 'running' && (bgmSource || !isMusicOn || !bgmWanted)) {
          evs.forEach(function(ev){ window.removeEventListener(ev, h, true); });
          unlockArmed = false;
        }
      };
      evs.forEach(function(ev){ window.addEventListener(ev, h, true); });
    }
    window.addEventListener('pagehide', function() { stopBgmAndClose(); });
    window.addEventListener('pageshow', function(e) {
      if (e.persisted) { leaving = false; unlockArmed = false; if (bgmWanted) { armBgmUnlock(); startBgm(); } }
    });
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        if (audioCtx && audioCtx.state === 'running') audioCtx.suspend().catch(function(){});
        if (mode === 'intro' || mode === 'fight' || mode === 'dying') setPaused(true);
      } else if (!leaving) {
        if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(function(){});
        if (bgmWanted) armBgmUnlock();
      }
    });

    // --- 効果音の部品 ---
    function tone(type, f0, f1, dur, vol, delay) {
      const c = ensureAudioCtx(); if (!c) return;
      if (c.state === 'suspended') c.resume().catch(function(){});
      const t0 = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t0);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.03);
    }
    function noise(dur, vol, cutoff, delay, ftype) {
      const c = ensureAudioCtx(); if (!c) return;
      if (c.state === 'suspended') c.resume().catch(function(){});
      const t0 = c.currentTime + (delay || 0), len = Math.max(1, Math.floor(c.sampleRate * dur));
      const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const s = c.createBufferSource(); s.buffer = b;
      const f = c.createBiquadFilter(); f.type = ftype || 'lowpass'; f.frequency.value = cutoff;
      const g = c.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      s.connect(f); f.connect(g); g.connect(c.destination); s.start(t0); s.stop(t0 + dur + 0.02);
    }
    function sfxJump() { tone('square', 400, 800, 0.1, 0.15); }
    function sfxCoin() { tone('triangle', 900, 1800, 0.1, 0.2); }
    function sfxHurt() { tone('sawtooth', 150, 80, 0.2, 0.3); noise(0.12, 0.2, 700); }
    function sfxThud() { tone('sine', 110, 36, 0.24, 0.5); noise(0.12, 0.25, 320); }
    function sfxGunshot() { noise(0.28, 0.5, 900); tone('sine', 150, 32, 0.34, 0.7); tone('square', 300, 60, 0.08, 0.12); }
    function sfxLaser() { tone('sine', 3600, 1300, 0.07, 0.16); tone('sine', 1500, 1100, 0.22, 0.12, 0.05); tone('triangle', 3000, 2000, 0.1, 0.05, 0.02); }
    function sfxDokun() { tone('sine', 85, 36, 0.24, 0.6); tone('sine', 60, 28, 0.2, 0.5, 0.02); }
    function sfxExplosion() { tone('sawtooth', 150, 10, 0.8, 0.4); tone('square', 50, 5, 0.8, 0.25); noise(0.6, 0.4, 1500); }
    function sfxGaugeTick(n) { tone('square', 420 + n * 130, 420 + n * 130, 0.06, 0.09); }
    function sfxHeal() { [660, 880, 1320].forEach(function(f, i) { tone('sine', f, f * 1.01, 0.28, 0.12, i * 0.09); tone('triangle', f * 2, f * 2, 0.18, 0.04, i * 0.09); }); }
    function sfxDrop() { tone('sine', 520, 980, 0.18, 0.1); tone('sine', 980, 740, 0.2, 0.08, 0.12); }
    function sfxPi(hi) { tone('square', hi ? 2500 : 1900, hi ? 2500 : 1900, hi ? 0.11 : 0.07, 0.13); }   // ターゲットマークの「ピピ！」
    function sfxChargeTick() { tone('square', 1760, 1760, 0.035, 0.07); }   // ライフ回復「ティリリリ」
    function sfxCount() { tone('square', 660, 660, 0.12, 0.12); }
    // ⚔️ 「しゃきーん！」：刃物を抜くような金属音（ノイズの擦過音 → 高音の響き）
    function sfxShakiin() {

    let mode = 'title';            // title / intro / fight / dying / boom / clear
    let t = 0, frameCount = 0, fightT = 0, paused = false;
    let shake = 0, flashA = 0;
    const cat = { hp: LIFE_MAX, healQ: 0, dead: false, y: CAT_REST, vy: 0, jumpBuf: 0, hitFlash: 0, gauge: 0, charge: 0, laserT: 0, glint: 0, nitro: 0, pop: 0,
                  powerFlash: 0, powerFlashMax: 30, powerFlashColor: '110,225,255' };
    const dog = { x: 270, hp: LIFE_MAX, hits: 0, flash: 0, muzzle: 0, mouth: false, walking: false, healT: 0, hurtT: 0, gone: false,
                  pulse: 0, beatN: 0, beatT: 0, beatInt: 60 };
    let bullets = [], parts = [], rings = [], labels = [], para = null;
    const aim = { y: 99, ty: 99, sl: 0 };   // 🎯 ターゲットマーク（次に撃つ高さ）
    function chooseAim() { aim.sl = [0, 0, 0, 0.2, -0.2, 0.35, -0.35][Math.floor(Math.random() * 7)]; aim.ty = Math.max(24, Math.min(140, 99.25 - aim.sl * (dog.x - 64))); }
    let nextShot = 0, pendingShot = false, pendT = 0, nextDrop = 0;
    let stats = { hitsTaken: 0, dodges: 0, heals: 0, time: 0 };

    function resetGame() {
      mode = 'intro'; t = 0; fightT = 0; paused = false; shake = 0; flashA = 0;
      cat.hp = LIFE_MAX; cat.healQ = 0; cat.dead = false; cat.y = CAT_REST; cat.vy = 0; cat.jumpBuf = 0; cat.hitFlash = 0; cat.gauge = 0; cat.charge = 0; cat.laserT = 0; cat.glint = 0; cat.nitro = 0; cat.pop = 0; cat.powerFlash = 0;
      dog.x = 270; dog.hp = LIFE_MAX; dog.hits = 0; dog.flash = 0; dog.muzzle = 0; dog.mouth = false; dog.walking = false; dog.healT = 0; dog.hurtT = 0; dog.gone = false;
      dog.pulse = 0; dog.beatN = 0; dog.beatT = 0; dog.beatInt = 60;
      bullets = []; parts = []; rings = []; labels = []; para = null; aim.sl = 0; aim.y = aim.ty = 99;
      pendingShot = false; pendT = 0; nextShot = 70; nextDrop = DROP_MIN + Math.floor(Math.random() * (DROP_MAX - DROP_MIN));
      stats = { hitsTaken: 0, dodges: 0, heals: 0, time: 0 };
      stopNitroSound();
    }
    function startGame() {
      resetGame();
      bgmOn();
    }

    // ---------- パーティクル ----------
    function burst(x, y, n, cols, spd, g) {
      for (let i = 0; i < n; i++) {
        const an = Math.random() * Math.PI * 2, v = Math.random() * spd;
        parts.push({ x: x, y: y, vx: Math.cos(an) * v, vy: Math.sin(an) * v - 1, g: g === undefined ? 0.15 : g, life: 30 + Math.random() * 30, size: 2 + Math.random() * 3, color: cols[Math.floor(Math.random() * cols.length)] });
      }
    }
    function addLabel(text, x, y, color) { labels.push({ text: text, x: x, y: y, life: 55, color: color }); }
    function dogCenter() { return { x: dog.x + 26, y: 100 }; }

    // ---------- 戦闘ロジック ----------
    function intensity() { return Math.min(1, (LIFE_MAX - dog.hp) / (LIFE_MAX - HIT_DMG)); }   // 発射頻度のみ：ポリスドッグのライフが減るほど上がる（弾速は一定）
    function fireBullet() {
      const sp = BULLET_SPEED;
      const sl = aim.sl;   // ターゲットマークが示していた高さに撃つ
      const mx = dog.x - 24, my = 61 + 25.5 * 1.5;
      bullets.push({ x: mx, y: my, vx: -sp, vy: -sp * sl, counted: false });
      chooseAim(); dog.muzzle = 4; sfxGunshot(); shake = Math.max(shake, 2);
      burst(mx - 4, my, 5, ['#e5e7eb', '#9ca3af', '#fde047'], 1.6, 0.02);
    }
    function onDodge() {
      stats.dodges++;
      if (cat.charge > 0 || cat.gauge >= GAUGE_MAX) return;
      cat.gauge++; cat.pop = 10; sfxGaugeTick(cat.gauge);
      if (cat.gauge >= GAUGE_MAX) startCharge();
    }
    function startCharge() {
      cat.gauge = GAUGE_MAX; cat.charge = CHARGE_FRAMES; cat.glint = 16;
      sfxShakiin();
      cat.powerFlash = cat.powerFlashMax = 24; cat.powerFlashColor = '140,240,255';
      rings.push({ cx: 40, cy: cat.y - 4, r: 4, a: 0.9, w: 2, c: '150,240,255', grow: 2.2, ell: 1 });
    }
    function fireLaser() {
      cat.laserT = 12; cat.gauge = 0; cat.charge = 0; sfxLaser();
      dog.hits++; dog.hp -= HIT_DMG; dog.flash = 6; dog.hurtT = 10; shake = Math.max(shake, 4);
      const c = dogCenter();
      burst(c.x, 84, 14, ['#fff', '#a5f3fc', '#22d3ee', '#fde047'], 3.5);
      if (dog.hp <= 0) startDying();
    }
    function catHurt() {
      stats.hitsTaken++;
      cat.hp -= HIT_DMG; cat.hitFlash = 45; cat.gauge = 0; cat.charge = 0; cat.glint = 0;
      sfxHurt(); shake = Math.max(shake, 5);
      if (cat.hp <= 0) startCatDie();
    }
    function startCatDie() {   // ガンジャキャット爆散 → GAME OVER
      mode = 'catdie'; t = 0; cat.dead = true; bullets.length = 0; pendingShot = false; para = null; cat.charge = 0; cat.laserT = 0;
      stopBgm(); stopNitroSound(); flashA = 1; shake = 18; sfxExplosion();
      burst(38, cat.y, 130, ['#fff', '#fde047', '#fb923c', '#ef4444', '#87CEEB', '#4169E1'], 8);
      rings.push({ cx: 38, cy: cat.y, r: 5, a: 1, w: 4, c: '255,200,80', grow: 3.5, ell: 1 });
    }
    function startDying() {
      mode = 'dying'; t = 0; bullets.length = 0; pendingShot = false; para = null; cat.charge = 0;
      stopBgm();
    }
    function pickType() {
      let ty = ['nitro', 'coin', 'heart'][Math.floor(Math.random() * 3)];
      if (ty === 'heart' && cat.hp >= LIFE_MAX) ty = Math.random() < 0.5 ? 'nitro' : 'coin';   // ライフ満タンならハートは出さない
      return ty;
    }
    function collectItem(p) {
      if (p.type === 'nitro') {
        cat.nitro = NITRO_TOTAL; sfxNitro(); sfxKirarin();
        cat.powerFlash = cat.powerFlashMax = 40; cat.powerFlashColor = '90,255,130';
        burst(34, cat.y, 24, ['#22c55e', '#86efac', '#bbf7d0', '#fff'], 4);
        addLabel('NITRO!', 36, cat.y - 22, '#86efac');
      } else if (p.type === 'heart') {
        cat.healQ += HEAL_AMOUNT;
        cat.powerFlash = cat.powerFlashMax = 30; cat.powerFlashColor = '255,120,170';
        burst(34, cat.y, 20, ['#f9a8d4', '#fb7185', '#ffffff', '#ef4444'], 3.5, -0.02);
        addLabel('LIFE UP!', 36, cat.y - 22, '#f9a8d4');
      } else {
        sfxCoin(); setTimeout(sfxCoin, 90);
        cat.powerFlash = cat.powerFlashMax = 30; cat.powerFlashColor = '255,215,0';
        burst(34, cat.y, 24, ['#ffd700', '#fde047', '#fff', '#b8860b'], 4);
        addLabel('LASER MAX!', 36, cat.y - 22, '#fde047');
        if (cat.charge <= 0 && cat.gauge < GAUGE_MAX) { cat.pop = 10; startCharge(); }
        else if (cat.charge <= 0) { startCharge(); }
      }
    }

    // ---------- 1フレーム更新 ----------
    function step() {
      frameCount++;
      if (mode === 'title') { titleStep(); return; }
      if (paused) return;
      t++;
      if (cat.hitFlash > 0) cat.hitFlash--;
      if (cat.powerFlash > 0) cat.powerFlash--;
      if (cat.glint > 0) cat.glint--;
      if (cat.pop > 0) cat.pop--;
      if (cat.laserT > 0) cat.laserT--;
      if (cat.healQ > 0 && !cat.dead && frameCount % 2 === 0) {   // ロックマン式：下から1行ずつ溜まる
        const add = Math.min(5, cat.healQ, LIFE_MAX - cat.hp);
        if (add <= 0) cat.healQ = 0; else { cat.hp += add; cat.healQ -= add; sfxChargeTick(); }
      }
      if (cat.nitro > 0) { cat.nitro--; if (cat.nitro === 0) stopNitroSound(); }
      if (dog.flash > 0) dog.flash--;
      if (dog.muzzle > 0) dog.muzzle--;
      if (dog.hurtT > 0) dog.hurtT--;
      if (dog.healT > 0) dog.healT--;
      if (dog.pulse > 0) dog.pulse -= 0.08;
      if (flashA > 0) flashA -= 0.05;
      if (shake > 0) shake -= 0.5;

      // ジャンプ・重力（GCRと同じ物理）
      cat.vy += 1.0; cat.y += cat.vy;
      if (cat.y >= CAT_REST) { cat.y = CAT_REST; cat.vy = 0; if (cat.jumpBuf > 0) doJump(); }
      if (cat.jumpBuf > 0) cat.jumpBuf--;

      if (mode === 'intro') stepIntro();
      else if (mode === 'fight') stepFight();
      else if (mode === 'dying') stepDying();
      else if (mode === 'catdie') { if (t >= 100) { mode = 'gameover'; t = 0; } }
      else if (mode === 'boom') { if (t >= 100) { mode = 'clear'; t = 0; stats.time = fightT / 60; sfxKirarin(); setTimeout(sfxKirarin, 220); } }

      // パーティクル・リング・ラベル
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--;
        if (p.life <= 0) parts.splice(i, 1);
      }
      for (let i = rings.length - 1; i >= 0; i--) { const rg = rings[i]; rg.r += rg.grow; rg.a -= 0.02; if (rg.a <= 0) rings.splice(i, 1); }
      for (let i = labels.length - 1; i >= 0; i--) { const lb = labels[i]; lb.y -= 0.35; lb.life--; if (lb.life <= 0) labels.splice(i, 1); }
    }

    function stepIntro() {
      dog.x = Math.max(DOG_STAND_X, 270 - 1.1 * t);
      dog.walking = dog.x > DOG_STAND_X;
      if (dog.walking && t % 20 === 1) { sfxThud(); shake = 5; }
      if (t === 105) { sfxKirarin(); }
      if (t === 110 || t === 130) sfxCount();
      if (t >= 180) { mode = 'fight'; t = 0; fightT = 0; dog.walking = false; chooseAim(); aim.y = aim.ty; }
    }

    function stepFight() {
      fightT++;
      const k = intensity();
      aim.y += Math.max(-2.5, Math.min(2.5, aim.ty - aim.y));
      // ポリスDOGの射撃：だんだん速く・頻繁に
      if (!pendingShot && fightT >= nextShot && Math.abs(aim.ty - aim.y) < 1.5) { pendingShot = true; pendT = 0; }
      if (pendingShot) { pendT++; if (pendT === 1) sfxPi(false); if (pendT === 10) sfxPi(true); }
      if (pendingShot && pendT >= 20) {
        pendingShot = false; fireBullet();
        const wait = SHOT_WAIT_START + (SHOT_WAIT_END - SHOT_WAIT_START) * k;
        const jitter = (45 - 30 * k) * Math.random();
        nextShot = fightT + Math.round(wait + jitter);
      }
      // 弾の移動・判定
      const top = cat.y - 14, bottom = cat.y + 18;
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bl = bullets[i]; bl.x += bl.vx; bl.y += bl.vy;
        if (bl.x - 16 < 48 && bl.x + 10 > 30 && bl.y + 4 > top && bl.y - 4 < bottom) {
          if (cat.hitFlash <= 0 && cat.nitro <= 0) { bullets.splice(i, 1); catHurt(); continue; }
        }
        if (!bl.counted && bl.x + 10 < 30) { bl.counted = true; onDodge(); }
        if (bl.x < -30 || bl.y < -20 || bl.y > 180) bullets.splice(i, 1);
      }
      if (mode !== 'fight') return;
      // レーザー溜め → 発射
      if (cat.charge > 0) {
        const an = Math.random() * Math.PI * 2, rr = 26;
        const hx = 42, hy = cat.y - 4;
        parts.push({ x: hx + Math.cos(an) * rr, y: hy + Math.sin(an) * rr, vx: -Math.cos(an) * rr / 12, vy: -Math.sin(an) * rr / 12, g: 0, life: 12, size: 2, color: ['#fff', '#67e8f9', '#a5f3fc'][Math.floor(Math.random() * 3)] });
        cat.charge--;
        if (cat.charge === 0) { fireLaser(); if (mode !== 'fight') return; }
      }
      // パラシュート支援物資（20〜40秒に1回）
      if (!para) {
        if (--nextDrop <= 0) {
          para = { x0: 30 + Math.random() * 16, x: 36, y: -30, t: 0, type: pickType() };
          sfxDrop();
        }
      } else {
        para.t++; para.y += 0.55; para.x = para.x0 + Math.sin(para.t * 0.06) * 4;
        const cx = para.x, cy = para.y + 20 + (para.type === 'nitro' ? 11 : 8);
        if (cx > 22 && cx < 54 && cy + 9 > top && cy - 9 < bottom) {
          collectItem(para); para = null;
          nextDrop = DROP_MIN + Math.floor(Math.random() * (DROP_MAX - DROP_MIN));
        } else if (para.y > 170) {
          para = null; nextDrop = DROP_MIN + Math.floor(Math.random() * (DROP_MAX - DROP_MIN));
        }
      }
      // 回復エフェクト（ポリスDOGの体の周りにヒーリングの光）
      if (dog.healT > 0) spawnHealFx();
    }
    function spawnHealFx() {
      if (dog.healT % 2 === 0) {
        const px = dog.x - 2 + Math.random() * 56, py = 78 + Math.random() * 55;
        parts.push({ x: px, y: py, vx: (Math.random() - 0.5) * 0.3, vy: -0.5 - Math.random() * 0.7, g: -0.005, life: 34 + Math.random() * 14, size: Math.random() < 0.5 ? 1 : 2, shape: Math.random() < 0.6 ? 'plus' : 'sq', color: ['#86efac', '#bbf7d0', '#ffffff', '#4ade80'][Math.floor(Math.random() * 4)] });
      }
      if (dog.healT === 48 || dog.healT === 28) rings.push({ cx: dog.x + 26, cy: 110, r: 6, a: 0.8, w: 2, c: '110,255,150', grow: 1.4, ell: 0.45 });
    }

    function stepDying() {   // 赤く発光しドクン…が加速して爆散（原作と同じ演出）
      dog.beatT++;
      if (dog.beatT >= dog.beatInt) {
        dog.beatT = 0; dog.beatN++; sfxDokun(); dog.pulse = 1; shake = Math.min(7, 1 + dog.beatN * 0.5);
        dog.beatInt = Math.max(6, dog.beatInt * 0.8);
        if (dog.beatN >= 14) {
          mode = 'boom'; t = 0; dog.gone = true; flashA = 1; shake = 18; sfxExplosion();
          burst(dog.x + 30, 100, 130, ['#fff', '#fde047', '#fb923c', '#ef4444', '#7f1d1d', '#1e3a8a'], 8);
          rings.push({ cx: dog.x + 30, cy: 100, r: 5, a: 1, w: 4, c: '255,120,60', grow: 3.5, ell: 1 });
        }
      }
    }

    // =====================================================================
    //  描画
    // =====================================================================
    function outlineText(str, x, y, size, color, align) {
      ctx.font = "bold " + size + "px 'Courier New'"; ctx.textAlign = align || 'left'; ctx.lineJoin = 'round';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(str, x, y);
      ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.textAlign = 'left';
    }
    function drawBullet(bl) {
      ctx.save(); ctx.translate(bl.x, bl.y); ctx.rotate(Math.atan2(bl.vy, bl.vx));
      ctx.fillStyle = '#e0b030'; ctx.fillRect(2, -4, 14, 8);
      ctx.fillStyle = '#b87333'; ctx.fillRect(-8, -4, 10, 8); ctx.fillRect(-10, -2, 2, 4);
      ctx.fillStyle = '#7a4a1e'; ctx.fillRect(14, -4, 2, 8);
      ctx.fillStyle = '#fff6c4'; ctx.fillRect(3, -3, 9, 2);
      ctx.restore();
    }
    function drawLifeBar(x, hp, col, flash) {   // ロックマン式：28行の縦ゲージ（1行=2px）
      const y = 14, w = 8, h = LIFE_ROWS * 2 + 2, rows = Math.ceil(hp / 5);
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(x, y, w, h);
      if (rows > 0) { const fh = rows * 2; ctx.fillStyle = flash > 0 ? '#ffffff' : col; ctx.fillRect(x + 1, y + 1 + LIFE_ROWS * 2 - fh, w - 2, fh); }
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      for (let i = 0; i < LIFE_ROWS; i++) ctx.fillRect(x + 1, y + 2 + i * 2, w - 2, 1);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    }
    function drawHud() {
      if (mode === 'title') return;
      // 縦のライフゲージ（左：ガンジャキャット / 右：ポリスドッグ）
      drawLifeBar(3, cat.hp, '#22d3ee', cat.hitFlash > 38 ? 1 : 0);
      if (!(mode === 'intro' && t < 60)) drawLifeBar(229, dog.hp, '#ef4444', dog.flash);
      // レーザーゲージ（ガンジャキャットの下＝左下）
      outlineText('LASER', 5, 156, 8, '#a5f3fc');
      const full = cat.gauge >= GAUGE_MAX;
      for (let i = 0; i < GAUGE_MAX; i++) {
        const px = 40 + i * 15, py = 147, on = i < cat.gauge;
        const popK = (on && i === cat.gauge - 1 && cat.pop > 0) ? cat.pop / 10 : 0;
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(px - popK * 2, py - popK * 2, 13 + popK * 4, 8 + popK * 4);
        if (on) {
          ctx.fillStyle = full ? (Math.floor(frameCount / 3) % 2 ? '#fde047' : '#ffffff') : '#22d3ee';
          ctx.fillRect(px + 1 - popK * 2, py + 1 - popK * 2, 11 + popK * 4, 6 + popK * 4);
        }
        ctx.strokeStyle = full ? '#fde047' : '#fff'; ctx.lineWidth = 1; ctx.strokeRect(px + 0.5, py + 0.5, 12, 7);
      }
      if (full && mode === 'fight') outlineText('MAX!', 118, 156, 9, Math.floor(frameCount / 4) % 2 ? '#fde047' : '#fff');
    }
    // 🎯 ターゲットマーク：ポリスドッグが次に撃つ高さを示す
    function drawAim() {
      const x = 40, y = Math.round(aim.y);
      const lit = pendingShot ? Math.min(1, pendT / 6) : 0, beep = pendingShot && (pendT < 6 || (pendT >= 10 && pendT < 16));
      ctx.save();
      if (pendingShot) glow(ctx, x, y, 12 + 8 * lit, 'rgba(255,255,255,' + (beep ? 0.55 : 0.3) + ')', 'rgba(255,60,60,0)');
      const col = beep ? '#ffffff' : '#ff3b3b';
      ctx.strokeStyle = col; ctx.lineWidth = beep ? 2 : 1.5;
      ctx.beginPath(); ctx.arc(x, y, beep ? 7 : 6, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 11, y); ctx.lineTo(x - 4, y); ctx.moveTo(x + 4, y); ctx.lineTo(x + 11, y);
      ctx.moveTo(x, y - 11); ctx.lineTo(x, y - 4); ctx.moveTo(x, y + 4); ctx.lineTo(x, y + 11); ctx.stroke();
      ctx.fillStyle = col; ctx.fillRect(x - 1, y - 1, 2, 2);
      ctx.restore();
    }

    function draw() {
      if (mode === 'title') { titleDraw(); return; }
      ctx.drawImage(bgCv, 0, 0);
      // 天井ランプのゆらめく明かり
      const fl = 0.12 + 0.03 * Math.sin(frameCount * 0.31) + 0.02 * Math.sin(frameCount * 0.93);
      glow(ctx, 70, 16, 80, 'rgba(255,200,110,' + fl + ')', 'rgba(255,200,110,0)');
      ctx.fillStyle = '#ffe9a8'; ctx.fillRect(69, 14, 3, 3);

      ctx.save();
      if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

      // ポリスDOG
      if (!dog.gone && (mode !== 'intro' || dog.x < 268)) {
        let jx = 0, jy = 0;
        if (mode === 'dying') {
          const cx = dog.x + 30, r = 50 + Math.max(0, dog.pulse) * 30, al = 0.25 + 0.15 * Math.min(1, dog.beatN / 14) + 0.45 * Math.max(0, dog.pulse);
          glow(ctx, cx, 100, r, 'rgba(255,40,40,' + al + ')', 'rgba(255,40,40,0)');
          jx = (Math.random() - 0.5) * Math.min(5, dog.beatN * 0.5);
        }
        if (dog.healT > 0) glow(ctx, dog.x + 26, 100, 44 + 4 * Math.sin(frameCount * 0.4), 'rgba(120,255,160,' + (0.32 * Math.min(1, dog.healT / 20)) + ')', 'rgba(120,255,160,0)');
        if (dog.hurtT > 0) { jx += (Math.random() - 0.5) * 3; jy += (Math.random() - 0.5) * 2; }
        drawBattleDog(jx, jy);
      }
      // パラシュート
      if (para) drawParachute(para);
      // ガンジャキャット
      if (mode !== 'title' && !cat.dead) {
        if (cat.hitFlash > 0 && Math.floor(cat.hitFlash / 3) % 2 === 0) ctx.globalAlpha = 0.4;
        const st = cat.hitFlash > 30 ? 'hit' : (cat.y < CAT_REST ? 'jump' : 'run');
        drawCat(CAT_X, cat.y, st);
        ctx.globalAlpha = 1;
      }
      // 弾丸
      bullets.forEach(drawBullet);
      if (mode === 'fight') drawAim();
      // レーザー
      if (cat.laserT > 0 && !(mode === 'boom' && dog.gone)) {
        const c = dogCenter(), ox = 49, oy = cat.y - 5, w = 1 + cat.laserT / 12 * 4;
        ctx.save(); ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 8; ctx.lineCap = 'butt';
        ctx.strokeStyle = '#67e8f9'; ctx.lineWidth = w + 2; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(c.x, 84); ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1, w - 2); ctx.stroke();
        ctx.restore();
      }
      // リング
      rings.forEach(function(rg) {
        ctx.strokeStyle = 'rgba(' + rg.c + ',' + Math.max(0, rg.a) + ')'; ctx.lineWidth = rg.w;
        ctx.beginPath(); ctx.ellipse(rg.cx, rg.cy, rg.r, rg.r * rg.ell, 0, 0, Math.PI * 2); ctx.stroke();
      });
      // パーティクル
      parts.forEach(function(p) {
        ctx.fillStyle = p.color;
        if (p.shape === 'plus') {
          const s = Math.max(1, Math.round(p.size));
          ctx.fillRect(Math.round(p.x) - s, Math.round(p.y), s * 3, s); ctx.fillRect(Math.round(p.x), Math.round(p.y) - s, s, s * 3);
        } else ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.max(1, Math.round(p.size)), Math.max(1, Math.round(p.size)));
      });
      ctx.restore();

      // ラベル
      labels.forEach(function(lb) { ctx.globalAlpha = Math.min(1, lb.life / 20); outlineText(lb.text, lb.x, lb.y, 9, lb.color, 'center'); ctx.globalAlpha = 1; });

      drawHud();

      // イントロ演出
      if (mode === 'intro' && t >= 105) {
        const k = Math.min(1, (t - 105) / 8), sc = 1 + (1 - k) * 1.2;
        ctx.save(); ctx.translate(120, 74); ctx.scale(sc, sc);
        outlineText('FIGHT!!', 0, 0, 20, '#ffffff', 'center');
        ctx.restore();
      }
      if (flashA > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, flashA) + ')'; ctx.fillRect(0, 0, W, H); }

      // クリア画面
      if (mode === 'clear') drawClear();
      if (mode === 'gameover') drawGameOver();
      if (paused) drawPause();
    }
    function drawClear() {
      const k = Math.min(1, t / 30);
      ctx.fillStyle = 'rgba(0,0,0,' + (0.62 * k) + ')'; ctx.fillRect(0, 0, W, H);
      if (t < 8) return;
      outlineText('YOU WIN!', 120, 52, 24, '#ffd700', 'center');
      outlineText('CLEAR TIME', 120, 82, 10, '#a5f3fc', 'center');
      outlineText(stats.time.toFixed(1) + ' SEC', 120, 106, 20, '#ffffff', 'center');
      if (t > 70 && Math.floor(t / 25) % 2 === 0) outlineText('A / TAP : PLAY AGAIN', 120, 134, 9, '#fff', 'center');
      outlineText('SELECT : TITLE', 120, 148, 8, '#cbd5e1', 'center');
    }
    function drawGameOver() {
      const k = Math.min(1, t / 30);
      ctx.fillStyle = 'rgba(0,0,0,' + (0.62 * k) + ')'; ctx.fillRect(0, 0, W, H);
      if (t < 8) return;
      outlineText('GAME OVER', 120, 76, 22, '#ef4444', 'center');
      if (t > 70 && Math.floor(t / 25) % 2 === 0) outlineText('A / TAP : RETRY', 120, 112, 9, '#fff', 'center');
      outlineText('SELECT : TITLE', 120, 130, 8, '#cbd5e1', 'center');
    }
    function drawPause() {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
      outlineText('PAUSE', 120, 72, 20, '#fff', 'center');
      outlineText('START : RESUME', 120, 96, 9, '#cbd5e1', 'center');
      outlineText('SELECT : TITLE', 120, 110, 9, '#cbd5e1', 'center');
    }

    // =====================================================================
    //  タイトル画面：ポリスDOGが何かを探してウロウロ歩く
    // =====================================================================
    const walkCanvas = document.getElementById('titleWalkCanvas');
    const wctx = walkCanvas.getContext('2d');
    const TD = { x: 85, dir: -1, mode: 'walk', modeT: 90, lookT: 0, fr: 0 };
    function titlePick() {
      const r = Math.random();
      if (r < 0.5) { TD.mode = 'walk'; TD.modeT = 70 + Math.floor(Math.random() * 130); if (Math.random() < 0.35) TD.dir *= -1; }
      else if (r < 0.75) { TD.mode = 'stand'; TD.modeT = 40 + Math.floor(Math.random() * 70); }
      else { TD.mode = 'look'; TD.lookT = 0; TD.modeT = 16 * (3 + Math.floor(Math.random() * 3)); }   // キョロキョロ
    }
    function titleStep() {
      TD.fr++; TD.modeT--;
      if (TD.mode === 'walk') {
        TD.x += 0.55 * TD.dir;
        if (TD.x < 14) { TD.x = 14; TD.dir = 1; }
        if (TD.x > 158) { TD.x = 158; TD.dir = -1; }
      } else if (TD.mode === 'look') {
        TD.lookT++; if (TD.lookT % 16 === 0) TD.dir *= -1;
      }
      if (TD.modeT <= 0) titlePick();
    }
    function titleDraw() {
      wctx.clearRect(0, 0, 200, 50);
      const bob = (TD.mode === 'stand' && Math.floor(TD.fr / 22) % 2) ? 1 : 0;
      drawPoliceDog(wctx, Math.round(TD.x), 12 + bob, 0.56, TD.fr, TD.mode === 'walk', 0, false, TD.dir === 1);
    }

    // =====================================================================
    //  入力・画面切り替え
    // =====================================================================
    function doJump() { cat.vy = -12.3; cat.jumpBuf = 0; sfxJump(); }
    function triggerJump() {
      if (mode === 'title') return;
      if (mode === 'clear' || mode === 'gameover') { if (t > 70) startGame(); return; }
      if (mode === 'catdie') return;
      if (paused || mode === 'boom') return;
      if (cat.y >= CAT_REST) doJump(); else cat.jumpBuf = 10;
    }
    function setPaused(p) {
      if (mode === 'title' || mode === 'clear' || mode === 'boom' || mode === 'catdie' || mode === 'gameover') return;
      paused = p;
      if (bgmGain) bgmGain.gain.value = p ? 0 : 0.22;
      if (p) stopNitroSoundSoft();
    }
    function stopNitroSoundSoft() { /* ニトロ音は短いのでそのまま */ }
    function togglePause() { if (mode === 'title' || mode === 'clear' || mode === 'boom' || mode === 'catdie' || mode === 'gameover') return; setPaused(!paused); }
    function showTitle() {
      bgmOff(); stopNitroSound();
      mode = 'title'; paused = false; startPressed = false;
      document.getElementById('setupOverlay').style.display = 'flex';
      const sb = document.getElementById('btnNormal'); if (sb) sb.classList.remove('pressed');
    }
    function setMusic(on) {
      isMusicOn = on;
      const b = document.getElementById('btnMusicToggle');
      if (b) { b.textContent = on ? '🎵 ON' : '🎵 OFF'; b.classList.toggle('is-on', on); }
      if (on) { if (bgmWanted) { startBgm(); if (!bgmSource) armBgmUnlock(); } } else stopBgm();
    }
    function resizeGame() {
      const wrapper = document.getElementById("gameWrapper"); if (!wrapper) return;
      const scale = Math.min(window.innerWidth / 340, window.innerHeight / 680);
      wrapper.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    }
    window.addEventListener("resize", resizeGame);

    function bindTap(el, fn) {
      if (!el) return;
      el.addEventListener("mousedown", function(e) { e.preventDefault(); fn(); });
      el.addEventListener("touchstart", function(e) { e.preventDefault(); fn(); }, { passive: false });
    }
    function initEvents() {
      resizeGame();
      const btn = document.getElementById('btnNormal');
      const press = function(e) {
        e.preventDefault();
        if (startPressed) return;
        startPressed = true;
        btn.classList.remove("pressed"); void btn.offsetWidth; btn.classList.add("pressed");
        sfxBoing(); bgmOn();
        setTimeout(function() { document.getElementById('setupOverlay').style.display = 'none'; resetGame(); }, 380);
      };
      btn.addEventListener("click", press);
      btn.addEventListener("touchend", press, { passive: false });
      const back = document.getElementById('btnBackSelect');
      const goBack = function(e) { e.preventDefault(); stopBgmAndClose(); window.location.href = BACK_URL; };
      back.addEventListener("click", goBack);
      back.addEventListener("touchstart", goBack, { passive: false });
      preloadBgm();

      bindTap(document.getElementById('dpadControl'), triggerJump);
      bindTap(document.getElementById('btnArea'), triggerJump);
      bindTap(canvas, triggerJump);
      bindTap(document.getElementById('btnStart'), togglePause);
      bindTap(document.getElementById('btnSelect'), function() { if (mode !== 'title') showTitle(); });

      const mb = document.getElementById('btnMusicToggle');
      if (mb) {
        const tog = function(e) { e.preventDefault(); e.stopPropagation(); setMusic(!isMusicOn); };
        mb.addEventListener('click', tog);
        mb.addEventListener('touchend', tog, { passive: false });
      }
      window.addEventListener("keydown", function(e) {
        if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); triggerJump(); }
        if (e.code === "Enter") togglePause();
        if (e.code === "KeyM" || e.code === "Backspace") { if (mode !== 'title') showTitle(); }
      });
    }

    // 60fps固定のメインループ（120Hzスマホでも速くならない）
    let lastTs = performance.now(), acc = 0;
    function loop(now) {
      requestAnimationFrame(loop);
      let dt = now - lastTs; lastTs = now;
      if (dt > 100) dt = 100;
      acc += dt;
      let n = 0;
      while (acc >= 1000 / 60 && n < 4) { step(); acc -= 1000 / 60; n++; }
      if (n === 4) acc = 0;
      draw();
    }
    initEvents();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
