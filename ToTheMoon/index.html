<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>GAME CAT - TO THE MOON</title>
  <!-- 📱 iPhoneの「ホーム画面に追加」で使われる名前(titleより優先される) -->
  <meta name="apple-mobile-web-app-title" content="ToTheMoon">

  <link rel="apple-touch-icon" href="../icon.png">
  <!-- 🌐 ブラウザのタブに表示されるアイコン -->
  <link rel="icon" type="image/png" href="../icon.png">

  <link rel="manifest" href="../manifest.json">

  <meta name="theme-color" content="#0f172a">
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      background-color: #0f172a;
      
      font-family: 'Courier New', Courier, monospace; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      height: 100dvh; 
      user-select: none; 
      -webkit-user-select: none; 
      overflow: hidden;
    }
    
    .game-container { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
    .game-wrapper { width: 340px; height: 680px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1); transform-origin: center center; flex-shrink: 0; }
    
    .gameboy-body { width: 100%; height: 100%; background: #cfcfc4; border-radius: 10px 10px 40px 10px; box-shadow: inset -5px -5px 0px #999, inset 5px 5px 0px #fff, 0 20px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; padding: 25px 15px; box-sizing: border-box; position: relative; }
    
    .gb-screen-border { width: 92%; height: 230px; background: #777773; border-radius: 5px 5px 25px 5px; border: 3px solid #555; display: flex; justify-content: center; align-items: center; position: relative; margin-top: 10px; }
    #gameCanvas { background: #8b956d; border: 4px solid #555; image-rendering: pixelated; }
    
    .gb-title { width: 92%; text-align: left; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: bold; color: #232323; margin-top: 10px; margin-bottom: 5px; padding-left: 6px; box-sizing: border-box; letter-spacing: -0.3px; }

    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; border-radius: 10px 10px 40px 10px;}
    
    .input-wrapper { position: relative; width: 80%; margin-bottom: 8px; display: flex; align-items: center; }
    .input-at { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #34d399; font-size: 16px; font-weight: bold; pointer-events: none; z-index: 10; }
    input[type="text"] {
      width: 100%; padding: 12px 35px; border-radius: 8px; border: 2px solid #10b981;
      background: #0f172a; color: #fff; font-size: 16px; text-align: left; box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700;
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.25);
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    input[type="text"]:focus { outline: none; border-color: #34d399; box-shadow: 0 0 22px rgba(52, 211, 153, 0.45); }
    .clear-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #ef4444; font-size: 20px; font-weight: bold; cursor: pointer; z-index: 10; }

    .remember-wrapper { width: 80%; text-align: left; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; letter-spacing: 0.2px; color: #d1fae5; }
    .remember-wrapper label { cursor: pointer; }
    .remember-wrapper input[type="checkbox"] { accent-color: #34d399; }

    .mode-buttons { display: flex; gap: 10px; width: 80%; flex-direction: column; }
    .start-btn {
      border: 2px solid transparent; padding: 14px 20px; font-size: 14px; cursor: pointer;
      border-radius: 10px; width: 100%; touch-action: manipulation;
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: 0.4px;
      background-color: #0f172a;
      color: #ffffff;
      transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
    }
    .start-btn:active { transform: translateY(2px) scale(0.99); filter: brightness(1.15); }

    .normal-btn {
      border-color: #3b82f6;
      background: linear-gradient(135deg, rgba(59,130,246,0.22) 0%, #0f172a 70%);
      box-shadow: 0 0 18px rgba(59, 130, 246, 0.35), inset 0 0 16px rgba(59, 130, 246, 0.08);
      text-shadow: 0 0 10px rgba(96, 165, 250, 0.8);
    }
    .boost-btn {
      border-color: #ef4444;
      background: linear-gradient(135deg, rgba(239,68,68,0.22) 0%, #0f172a 70%);
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.35), inset 0 0 16px rgba(239, 68, 68, 0.08);
      text-shadow: 0 0 10px rgba(248, 113, 113, 0.8);
    }
    .hell-btn {
      border-color: #b91c1c;
      background: linear-gradient(135deg, rgba(185,28,28,0.28) 0%, #0f172a 70%);
      box-shadow: 0 0 18px rgba(185, 28, 28, 0.45), inset 0 0 16px rgba(185, 28, 28, 0.12);
      text-shadow: 0 0 10px rgba(248, 113, 113, 0.8);
    }

    .start-btn.pressed { animation: startPress 0.38s ease-out both; box-shadow: 0 0 30px rgba(96, 165, 250, 0.95), inset 0 0 20px rgba(255, 255, 255, 0.35); }
    @keyframes startPress {
      0% { transform: none; filter: brightness(1); }
      20% { transform: translateY(5px) scale(0.94, 0.9); filter: brightness(1.5); }
      55% { transform: translateY(-4px) scale(1.06, 1.08); filter: brightness(1.7); }
      100% { transform: translateY(0) scale(1.02); filter: brightness(1.3); }
    }
    /* 🛒 アイテム選択（STARTの下） */
    .item-area { width: 100%; }
    .item-head { display: flex; justify-content: space-between; align-items: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; color: #94a3b8; margin-bottom: 6px; text-align: left; }
    .item-note.err { color: #fca5a5; }
    .wallet-top { position: absolute; top: 14px; right: 14px; z-index: 20; }
    .wallet-top-btn { display: flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #6ee7b7, #34d399); color: #052e16; border: 2px solid #052e16; border-radius: 10px; padding: 8px 16px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.5px; cursor: pointer; touch-action: manipulation; box-shadow: 0 3px 0 #065f46, 0 0 14px rgba(52, 211, 153, 0.45); }
    .wallet-top-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #065f46; }
    .wallet-top-btn.on { background: #0f172a; color: #e2e8f0; border-color: #34d399; box-shadow: 0 0 12px rgba(52, 211, 153, 0.35); }
    .wallet-top-btn.on::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #34d399; }

    .wallet-box-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 1px; color: #6ee7b7; margin-bottom: 4px; }
    .wallet-item { display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; margin-top: 8px; padding: 10px 12px; background: #1e293b; color: #ffffff; border: 1px solid #475569; border-radius: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; text-align: left; touch-action: manipulation; }

    .wallet-item img { width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0; }
    .wallet-hint { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; line-height: 1.5; color: #94a3b8; margin-top: 8px; }
    .wallet-addr { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 13px; color: #e2e8f0; margin: 8px 0; word-break: break-all; }
    .wallet-close { margin-top: 12px; background: transparent; color: #94a3b8; border: 1px solid #475569; padding: 6px 16px; border-radius: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 12px; cursor: pointer; touch-action: manipulation; }
    .item-row { display: flex; gap: 6px; }
    .item-card { flex: 1; position: relative; box-sizing: border-box; border: 1px solid rgba(148, 163, 184, 0.35); padding: 8px 4px 6px; text-align: center; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: border-color 0.15s, box-shadow 0.15s; }
    .item-card.sel { border-color: #34d399; box-shadow: 0 0 12px rgba(52, 211, 153, 0.45), inset 0 0 8px rgba(52, 211, 153, 0.12); }
    .item-card.sel::after { content: '\2713'; position: absolute; top: 3px; right: 6px; color: #6ee7b7; font-size: 12px; font-weight: 800; }
    .item-name { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 10px; white-space: nowrap; color: #e2e8f0; }
    .item-img { width: 56px; height: 56px; image-rendering: pixelated; display: block; margin: 4px auto; }
    .item-desc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9.5px; line-height: 1.3; color: #cbd5e1; min-height: 40px; }
    .item-price { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 11px; color: #6ee7b7; margin-top: 2px; }
    #setupOverlay { overflow-y: auto; justify-content: safe center; }
    .lb-panel { width: 100%; }
    .lb-tabs { display: flex; gap: 6px; margin-bottom: 6px; }
    .lb-tab { flex: 1; background: #0f172a; color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.35); border-radius: 8px; padding: 7px 4px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 0.8px; cursor: pointer; touch-action: manipulation; }
    .lb-tab.on { color: #6ee7b7; border-color: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.35); }
    .lb-rows { border: 1px solid rgba(148, 163, 184, 0.35); border-radius: 8px; padding: 6px 10px; min-height: 90px; box-sizing: border-box; text-align: left; }
    .lb-row { display: flex; justify-content: space-between; gap: 8px; font-family: 'Courier New', monospace; font-weight: 700; font-size: 11px; line-height: 15px; color: #fff; }
    .lb-row .v { color: #ffd700; white-space: nowrap; }
    .lb-empty { text-align: center; color: #94a3b8; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; padding-top: 30px; }
    .item-note { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9px; color: #94a3b8; margin-top: 6px; text-align: center; }
    .dpad { position: absolute; left: 35px; bottom: 180px; width: 80px; height: 80px; cursor: pointer; z-index: 5; }
    .dpad-axis { position: absolute; background: #2b2b2b; border-radius: 3px; box-shadow: 0 4px 0 #111; }
    .dpad-h { top: 27px; left: 0; width: 80px; height: 26px; }
    .dpad-v { top: 0; left: 27px; width: 26px; height: 80px; }
    
    /* 🎯 押し損ね防止用：A/Bボタン周辺の親タップエリア */
    .gb-buttons-area { 
      position: absolute; 
      right: 15px; 
      bottom: 155px; 
      width: 140px; 
      height: 120px; 
      z-index: 5; 
      cursor: pointer;
    }
    .gb-buttons { position: absolute; right: 20px; bottom: 40px; display: flex; gap: 15px; transform: rotate(-25deg); pointer-events: none; }
    .gb-btn { width: 44px; height: 44px; background: #a32249; border-radius: 50%; box-shadow: 0 4px 0 #5c1126, inset -2px -2px 3px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.7); font-size: 14px; font-weight: bold; pointer-events: auto; }
    .gb-btn:active, .gb-btn.active { transform: translateY(4px); box-shadow: 0 0px 0 #5c1126; }

    .gb-menu { position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); display: flex; gap: 25px; z-index: 5; }
    .gb-menu-btn { width: 45px; height: 10px; background: #7b7b77; border-radius: 5px; box-shadow: 0 2px 0 #444; position: relative; cursor: pointer; }
    .gb-menu-label { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 9px; color: #555; font-weight: bold; font-family: 'Courier New', monospace; }

    .gb-speaker { position: absolute; right: 30px; bottom: 45px; width: 50px; height: 45px; display: flex; gap: 6px; transform: rotate(-28deg); }
    .gb-speaker-line { width: 4px; height: 100%; background: #9a9a91; border-radius: 2px; box-shadow: inset 1px 1px 0px rgba(0,0,0,0.2); }

    .music-btn {
      position: absolute;
      bottom: 25px;
      left: 25px;
      background: #0f172a;
      color: #64748b;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 7px 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      z-index: 300;
      box-shadow: none;
      outline: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.12s;
    }
    .music-btn.is-on {
      color: #6ee7b7;
      border-color: #34d399;
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.4), inset 0 0 10px rgba(52, 211, 153, 0.1);
    }
    .music-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    #statusMessage { position: absolute; color: #333; font-size: 11px; bottom: 20px; font-weight: bold; width: 80%; text-align: center; z-index: 200; pointer-events: none;}

    /* 🌿 タイトル文字：白→エメラルドグリーンのグラデーション + ネオン風の光彩 */
    .title-glow {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(135deg, #ffffff 0%, #34d399 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(52, 211, 153, 0.3);
    }
    /* ℹ️ タイトル画面の説明ボックス（TO THE MOON） */
    .info-box { width: 100%; box-sizing: border-box; border: 1px solid rgba(148, 163, 184, 0.35); padding: 10px 12px; text-align: left; }
    .info-lead { font-family: 'Plus Jakarta Sans', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 0.4px; color: #6ee7b7; margin-bottom: 6px; text-align: center; }
    .info-text { font-family: 'Plus Jakarta Sans', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif; font-size: 10px; line-height: 1.5; color: #cbd5e1; margin-bottom: 6px; }
    .help-modal { position: absolute; inset: 0; z-index: 250; background: rgba(2, 6, 23, 0.94); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; box-sizing: border-box; }
    .help-modal img { max-width: 100%; max-height: 82%; object-fit: contain; border-radius: 10px; background: #0f172a; }
    .lang-sw { display: flex; justify-content: flex-end; margin-top: 4px; }
    .lang-sw button { font: 700 9px 'Plus Jakarta Sans', sans-serif; padding: 3px 9px; border: 1px solid rgba(148, 163, 184, 0.5); background: transparent; color: #94a3b8; cursor: pointer; }
    .lang-sw button.on { background: #34d399; color: #06281c; border-color: #34d399; }
    * { touch-action: manipulation; -webkit-touch-callout: none; }
    #gameCanvas, #btnArea { touch-action: none; }
  </style>
</head>
<body>
<div class="game-container">
    <div id="gameWrapper" class="game-wrapper">
      <div class="gameboy-body">
        
        <button id="btnMusicToggle" class="music-btn is-on">🎵 ON</button>

        <div class="gb-screen-border">
          <canvas id="gameCanvas" width="240" height="160"></canvas>
        </div>
        
        <div class="gb-title">TO THE MOON</div>

        <div id="statusMessage"></div>
        
        <div id="dpadControl" class="dpad">
          <div class="dpad-axis dpad-h"></div>

          <div class="gb-buttons">

            <div id="btnA" class="gb-btn">A</div>

        <div class="gb-menu">

        </div>
        
        <div class="gb-speaker">
          <div class="gb-speaker-line"></div>
          <div class="gb-speaker-line"></div>
          <div class="gb-speaker-line"></div>
          <div class="gb-speaker-line"></div>
        </div>


        <div id="setupOverlay" class="overlay">
          <div class="wallet-top"><button id="btnWallet" class="wallet-top-btn" type="button">CONNECT</button></div>
          <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:0;">
            <h1 class="title-glow" style="font-size: 26px; margin-bottom: 5px;">TO THE MOON</h1>
          </div>
          <canvas id="titleCanvas" width="200" height="50" style="image-rendering: pixelated; margin: 2px 0 8px;"></canvas>
          <div class="mode-buttons">
            <div class="info-box">
              <div id="infoLead" class="info-lead">LET'S SEND GANJA CAT TO THE MOON, TOGETHER!</div>
              <div id="infoT1" class="info-text"></div>
              <div id="infoT2" class="info-text"></div>
              <div id="walletMsg" class="item-note"></div>
              <div class="lang-sw"><button id="langEN" class="on" type="button">EN</button><button id="langJP" type="button">JP</button></div>

            </div>
          </div>
        <div id="helpModal" class="help-modal" style="display:none;"><img id="helpImg" alt="How to play"><button id="helpClose" class="start-btn" type="button" style="width:auto;padding:10px 30px;font-size:13px;background:#334155;color:#fff;border-color:#34d399;">CLOSE</button></div>
      </div>
    </div>
  </div>

  <script>
(()=>{
const W=240,H=160;
const cv=document.getElementById('gameCanvas');let g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.floor(x),Math.floor(y),w,h)};
const disc=(c,cx,cy,r,col)=>{c.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy+r));c.fillRect(cx-w,cy+dy,w*2+1,1)}};
/* ---------- 3x5 ドット文字 ---------- */
const F={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',0:'111101101101111',1:'010110010010111',2:'110001010100111',3:'110001010001110',4:'101101111001001',5:'111100110001110',6:'011100111101111',7:'111001010010010',8:'111101111101111',9:'111101111001110','!':'010010010000010','.':'000000000000010','-':'000000111000000',':':'000010000010000','<':'001010100010001','>':'100010001010100','?':'110001010000010','/':'001001010100100',',':'000000000010100','+':'000010111010000','%':'101001010100101'};
function T(s,x,y,c,k=1,al='c',sh='#000'){
  s=String(s).toUpperCase();const w=s.length*4*k-k;
  x=Math.floor(al==='c'?x-w/2:al==='r'?x-w:x);
  for(const [col,o] of sh?[[sh,k],[c,0]]:[[c,0]]){
    g.fillStyle=col;
    for(let i=0;i<s.length;i++){const p=F[s[i]];if(!p)continue;
      for(let j=0;j<15;j++)if(p[j]==='1')g.fillRect(x+i*4*k+(j%3)*k+o,y+((j/3)|0)*k+o,k,k)}
  }
}

/* ---------- サウンド：GCRと同じ効果音（GCRのコードをそのまま移植） ---------- */
let audioCtx=null;
function playKirarin() {

        if (!acc || !acc[0]) throw new Error("no account");
        ethProv = provider; walletAddress = acc[0];
        await ensureFlare();
        hookProvider(provider); updateWalletUI(); walletMsg(DEFAULT_NOTE);
        saveWalletChoice(provider); fillRewardWallet();
        closeWalletModal(true);
      } catch (e) {
        ethProv = null; walletAddress = ""; updateWalletUI(); walletMsg("Wallet connection cancelled.", true);
      }
    }
    function encodeTransfer(to, amount) {   // ERC-20 transfer(to, amount×10^18)
      return "0xa9059cbb" + to.toLowerCase().replace("0x", "").padStart(64, "0") + (BigInt(amount) * 10n ** 18n).toString(16).padStart(64, "0");
    }
    async function tokenBalance(addr) {   // WFLRの残高（整数）
      const r = await eth().request({ method: "eth_call", params: [{ to: WFLR_TOKEN, data: "0x70a08231" + addr.toLowerCase().replace("0x", "").padStart(64, "0") }, "latest"] });
      return BigInt(r || "0x0") / (10n ** 18n);
    }
    async function waitReceipt(hash, timeoutMs) {
      const t0 = Date.now();
      while (Date.now() - t0 < timeoutMs) {
        const rc = await eth().request({ method: "eth_getTransactionReceipt", params: [hash] });
        if (rc) return rc;
        await new Promise(function(r) { setTimeout(r, 2000); });
      }
      return null;
    }
    async function sendDonation(amt, say) {   // 戻り値 { ok, msg }。テストモードでは実際には送金しない
      say = say || function() {};
      if (!DONATE_LIVE) { say("TEST MODE: NO REAL PAYMENT"); await new Promise(function(r) { setTimeout(r, 1400); }); return { ok: true }; }
      try {
        if (!walletAddress) { say("CONNECT YOUR WALLET"); if (!(await connectWallet())) return { ok: false, msg: "WALLET NOT CONNECTED" }; }
        say("CHECKING NETWORK"); await ensureFlare();
        if ((await tokenBalance(walletAddress)) < BigInt(amt)) return { ok: false, msg: "NOT ENOUGH WFLR" };
        say("CONFIRM IN YOUR WALLET");
        let hash;
        try { hash = await eth().request({ method: "eth_sendTransaction", params: [{ from: walletAddress, to: WFLR_TOKEN, data: encodeTransfer(DONATE_ADDRESS, amt) }] }); }
        catch (e) { return { ok: false, msg: "CANCELLED" }; }
        say("WAITING FOR CONFIRMATION");
        const rc = await waitReceipt(hash, 90000);
        if (!rc) return { ok: false, msg: "TIMED OUT. CHECK YOUR WALLET" };
        if (rc.status !== "0x1") return { ok: false, msg: "TRANSACTION FAILED" };
        return { ok: true, hash: hash };
      } catch (e) { return { ok: false, msg: "SOMETHING WENT WRONG" }; }
    }
    (function() {
      const b = document.getElementById("btnWallet"), c = document.getElementById("walletClose");
      if (b) b.addEventListener("click", function() { openWalletModal(); });
      if (c) c.addEventListener("click", function() { closeWalletModal(!!walletAddress); });
      walletMsg(DEFAULT_NOTE);
      updateWalletUI();
    })();
    // 🔁 以前つないだウォレットを、確認なしで自動的に再接続する（選んだウォレットも覚えている）
    function pickSavedProvider() {
      discoverWallets();
      let saved = null;
      try { saved = JSON.parse(lsGet("gcr2Wallet") || "null"); } catch (e) {}
      if (saved) {
        const m = discovered.filter(function(w) { return saved.rdns ? w.rdns === saved.rdns : (saved.name && w.name === saved.name); })[0];
        if (m) return m.provider;
        if (saved.injected && window.ethereum) return window.ethereum;
        return null;
      }
      if (!lsGet("gcr2WalletOff") && window.ethereum) return window.ethereum;   // ウォレットアプリ内ブラウザ（以前の動作）
      return null;
    }
    async function tryRestoreWallet() {
      if (walletAddress) return true;
      let sv = null;
      try { sv = JSON.parse(lsGet("gcr2Wallet") || "null"); } catch (e) {}
      if (sv && sv.wc) {   // WalletConnectで接続していた場合：保存されたセッションから戻す
        try {
          const w = await getWcProvider();
          if (!walletAddress && w.session && w.accounts && w.accounts[0]) { ethProv = w; walletAddress = w.accounts[0]; hookProvider(w); updateWalletUI(); fillRewardWallet(); return true; }
        } catch (e) {}
        return false;
      }
      const p = pickSavedProvider();
      if (!p || !p.request) return false;
      try {
        const a = await p.request({ method: "eth_accounts" });
        if (a && a[0] && !walletAddress) { ethProv = p; walletAddress = a[0]; hookProvider(p); updateWalletUI(); saveWalletChoice(p); fillRewardWallet(); return true; }
      } catch (e) {}
      return false;
    }
    [0, 400, 1200, 2500, 4500].forEach(function(ms) { setTimeout(function() { tryRestoreWallet(); }, ms); });   // ウォレットの検出が遅れる場合に備え、数回試す

function stepG(o){
  const K=GK[o.k];

      if(o.k==='barrel'){o.u+=o.run;o.run=0}

/* ---------- タップ ---------- */
function tapAt(sx,sy){
  if(!lch&&ready()){const bx=sxOf(PADX-58),by=syOf(H6)-14;if(Math.abs(sx-bx)<17&&Math.abs(sy-by)<17){startLaunch();return}}
  // 太陽（夜は月）：ピカッ
  if(camY<H6+700&&Math.hypot(sx-208,sy-22)<15){sunFlash=28;flash=Math.max(flash,6);tone(3000,4200,.07,.1);later(70,()=>tone(4200,2400,.12,.08,'triangle'));return}
  // 月面の宇宙人・UFO
  if(lch&&lch.s===5){for(const a of aliens){if(Math.abs(sx-a.x)<10&&sy>moonY(a.x)-24&&sy<moonY(a.x)+4){a.t=40;[0,1,2].forEach(i=>later(i*110,()=>tone(1000+i*300,1400+i*300,.09,.1,'square')));return}}}
  for(const u of ufoList()){if(Math.abs(sx-u.sx)<20&&Math.abs(sy-u.sy)<14){u.o.beam=50;tone(300,1400,.5,.1,'sine');later(300,()=>tone(1400,300,.4,.08,'sine'));return}}
  // ネコ・テント
  if(!lch&&!warp){const cx=sxOf(catX()),cy=syOf(HM(viewM));
    if(doing&&doing.k==='tent'){if(Math.abs(sx-cx)<26&&sy>cy-34&&sy<cy+6){doing.shake=14;tone(110,85,.3,.08,'sawtooth');return}}
    else if(Math.abs(sx-cx)<20&&sy>cy-36&&sy<cy+6){hopT=24;meow();spawn(catX(),HM(viewM)+24,8,['#ff7ab8','#ff9ec8'],1.2,-0.02,40,2);return}}
  // 各マウンテンのギミック
  if(!lch&&!warp)for(const o of gm[viewM]){if(o.dead>0)continue;const K=GK[o.k],wr=featX(o.u,LG);if(padZone(wr))continue;const ox=sxOf(wr)+Math.round(o.run),oy=syOf(HM(viewM))-Math.round(o.rise);
    if(Math.abs(sx-ox)<K.hw+3&&sy>oy-K.h-2&&sy<oy+4){gInteract(o);return}}

    if(t%3===0)spawn(PADX+(Math.random()*30-15),H6+2,2,['#fbbf24','#f97316'],1.8,0.08,26,2);

    if(t>=180){shake=Math.max(shake,4);spawn(PADX+(Math.random()*20-10),H6+2,2,['#e2e8f0','#fff','#fbbf24'],1.5,-0.02,60,3)}

  }else if(l.s===4){                             // ④ 発射！約15秒の飛行（最後の約2.5秒で月に着陸）

function upd(){
  af++;
  if(st!=='PLAY')return;
  tickHold();
  const nt=nightWanted()?1:0;nightF+=clamp(nt-nightF,-1/300,1/300);
  if(sunFlash>0)sunFlash--;
  // 寄付の合計に合わせて進む（本当の進み）。「THANK YOU」の枠が出ている間や転送中は止まる
  const P=clamp(total/GOAL,0,1),diff=P-dP;advancing=false;
  if(diff>0&&!menu&&!lch&&!warp){
    advancing=true;dP=Math.min(P,dP+Math.max(0.00002,diff*0.03));
    if(viewM===realM&&realM<NM-1&&dP*NM>=realM+1){dP=(realM+1)/NM;advancing=false;startWarp(realM+1,false)}   // ゴールの転送ゲートへ
    else if(viewM!==realM){const mi=Math.min(NM-1,Math.floor(dP*NM+1e-9));if(mi>realM){realM=mi;showToast('MT.'+(mi+1)+' UNLOCKED!')}}
  }

  if(summitDone)summitT++;
  // 見た目だけの前進：寄付がなくても、いつも歩き続けている（距離のカウントも地面の色も変わらない）
  let f=1;if(lch||menu||paused||warp)f=0;if(doing&&(doing.k==='tent'||doing.k==='pizza'))f=0;
  if(viewM===realM)f*=clamp((endX(viewM)-catX()-210)/80,0,1);   // ゴールの手前では止まる
  visV+=(0.42*f-visV)*0.08;vis+=visV;walking=visV>0.12||advancing;
  if(lch){lch.t++;stepLaunch()}
  if(doing){doing.t++;stepAct()}
  if(warp)stepWarp();
  updCam();
  // 世界の動き
  clouds.forEach(c=>{c.x+=c.v;if(c.puff>0)c.puff--});
  gm[viewM].forEach(stepG);
  [slopeUFOs,moonUFOs].forEach(L=>L.forEach(u=>{if(u.beam>0)u.beam--}));
  aliens.forEach(a=>{if(a.t>0)a.t--});
  sats.forEach(s=>{s.x+=s.v;if(s.x>250)s.x=-10;if(s.x<-10)s.x=250;if(s.bl>0)s.bl--});
  plane.x+=plane.v;if(plane.x>290)plane.x=-40;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx-visV;p.y+=p.vy;p.vy-=p.g;if(--p.l<=0)parts.splice(i,1)}
  for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.x+=m.vx;m.y+=m.vy;if(--m.l<=0)meteors.splice(i,1)}
  if(hopT>0)hopT--;if(liftT>0)liftT--;if(doing&&doing.shake>0)doing.shake--;
  if(toast&&++toast.t>200)toast=null;
  if(guideT>0)guideT--;
  if(menu&&menu.stage==='DONE'&&++menu.t>150)closeMenu();
  if(USE_DUMMY_DATA){if(--fakeT<=0){fakeDonor();fakeT=(60*(7+Math.random()*9))|0}}
  else if(af%1200===0)pollData();
  // 月面：到着したあとの花火
  if(lch&&lch.s===5&&lch.t>150&&af%45===0){const wx=camX+(20+Math.random()*200-SX),wy=camY+FEET-(20+Math.random()*50);spawn(wx,wy,26,[pick(['#ff5d8f','#ffd23f','#6ee7b7','#7efff5','#b388ff'])],2.2,0.04,50,2);if(af%135===0)playKirarin();else tone(300+Math.random()*200,60,.3,.1,'sawtooth')}
}

/* A/B は pointerdown で受ける（親の btnArea が pointerdown を preventDefault するため mousedown/click だとマウスで効かない） */

/* 十字キー（画面の十字ボタン） */
(function(){const el=$('dpadControl');if(!el)return;el.style.touchAction='none';let down=false;
  const setFrom=e=>{const r=el.getBoundingClientRect(),dx=(e.clientX-(r.left+r.width/2))/r.width,dy=(e.clientY-(r.top+r.height/2))/r.height;let k=null;
    if(Math.abs(dx)>=Math.abs(dy)){if(dx>0.12)k='r';else if(dx<-0.12)k='l'}else{if(dy>0.12)k='d';else if(dy<-0.12)k='u'}dpadSet(k)};
  el.addEventListener('pointerdown',e=>{e.preventDefault();down=true;try{el.setPointerCapture(e.pointerId)}catch(_){}setFrom(e)});
  el.addEventListener('pointermove',e=>{if(down)setFrom(e)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>{down=false;dpadSet(null)}))})();
addEventListener('keydown',e=>{
  if(confirmT){e.preventDefault();if(e.code==='KeyA'||e.code==='KeyZ')answerTitleConfirm(true);else if(e.code==='KeyB'||e.code==='KeyX'||e.code==='Escape')answerTitleConfirm(false);return}
  const dk={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.code];
  if(dk){e.preventDefault();if(!e.repeat)dpadHold(dk,true);return}
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)act2()}

  if(e.code==='KeyA'||e.code==='KeyZ'){e.preventDefault();if(!e.repeat)onA()}
  if(e.code==='KeyB'||e.code==='KeyX'||e.code==='Escape'){e.preventDefault();if(!e.repeat)onB()}
  if(e.code==='Enter'){e.preventDefault();if(!e.repeat)togglePause()}
  if(e.code==='KeyM'||e.code==='Backspace')onSelect();
});
addEventListener('keyup',e=>{const dk={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.code];if(dk)dpadHold(dk,false)});

requestAnimationFrame(loop);
})();
