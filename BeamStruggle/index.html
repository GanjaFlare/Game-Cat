    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; border-radius: 10px 10px 40px 10px;}
    
    .input-wrapper { position: relative; width: 80%; margin-bottom: 8px; display: flex; align-items: center; }

    input[type="text"] {
      width: 100%; padding: 12px 35px; border-radius: 8px; border: 2px solid #10b981;
      background: #0f172a; color: #fff; font-size: 16px; text-align: left; box-sizing: border-box;

    .remember-wrapper { width: 80%; text-align: left; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; letter-spacing: 0.2px; color: #d1fae5; }

    .mode-buttons { display: flex; gap: 10px; width: 80%; flex-direction: column; }

      border: 2px solid transparent; padding: 14px 20px; font-size: 14px; cursor: pointer;

    .normal-btn {
      border-color: #3b82f6;

    .hell-btn {
      border-color: #b91c1c;

    .dpad { position: absolute; left: 35px; bottom: 180px; width: 80px; height: 80px; cursor: pointer; z-index: 5; }
    .dpad-axis { position: absolute; background: #2b2b2b; border-radius: 3px; box-shadow: 0 4px 0 #111; }
    .dpad-h { top: 27px; left: 0; width: 80px; height: 26px; }
    .dpad-v { top: 0; left: 27px; width: 26px; height: 80px; }
    
    /* 🎯 押し損ね防止用：A/Bボタン周辺の親タップエリア */
    .gb-buttons-area { 
      position: absolute; 
      right: 15px; 
      bottom: 155px; 
      width: 140px; 
      height: 120px; 
      z-index: 5; 
      cursor: pointer;
    }
    .gb-buttons { position: absolute; right: 20px; bottom: 40px; display: flex; gap: 15px; transform: rotate(-25deg); pointer-events: none; }
    .gb-btn { width: 44px; height: 44px; background: #a32249; border-radius: 50%; box-shadow: 0 4px 0 #5c1126, inset -2px -2px 3px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.7); font-size: 14px; font-weight: bold; pointer-events: auto; }
    .gb-btn:active, .gb-btn.active { transform: translateY(4px); box-shadow: 0 0px 0 #5c1126; }

    .gb-menu { position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); display: flex; gap: 25px; z-index: 5; }
    .gb-menu-btn { width: 45px; height: 10px; background: #7b7b77; border-radius: 5px; box-shadow: 0 2px 0 #444; position: relative; cursor: pointer; }
    .gb-menu-label { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 9px; color: #555; font-weight: bold; font-family: 'Courier New', monospace; }

    .gb-speaker { position: absolute; right: 30px; bottom: 45px; width: 50px; height: 45px; display: flex; gap: 6px; transform: rotate(-28deg); }
    .gb-speaker-line { width: 4px; height: 100%; background: #9a9a91; border-radius: 2px; box-shadow: inset 1px 1px 0px rgba(0,0,0,0.2); }

    .music-btn {
      position: absolute;
      bottom: 25px;
      left: 25px;
      background: #0f172a;
      color: #64748b;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 7px 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      z-index: 300;
      box-shadow: none;
      outline: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.12s;
    }
    .music-btn.is-on {
      color: #6ee7b7;
      border-color: #34d399;
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.4), inset 0 0 10px rgba(52, 211, 153, 0.1);
    }
    .music-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    #statusMessage { position: absolute; color: #333; font-size: 11px; bottom: 20px; font-weight: bold; width: 80%; text-align: center; z-index: 200; pointer-events: none;}

    .share-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 6px;
      font-size: 0;
      cursor: pointer;
      z-index: 120;
      border-radius: 4px;
      display: none;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
      line-height: 0;
      transition: background 0.2s;
    }
    .share-btn:active {
      transform: translateY(1px);
      box-shadow: 0px 0px 0px rgba(0,0,0,0);
      background: rgba(0, 0, 0, 0.8);
    }

    /* 🌿 タイトル文字：白→エメラルドグリーンのグラデーション + ネオン風の光彩 */
    .title-glow {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(135deg, #ffffff 0%, #34d399 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(52, 211, 153, 0.3);
    }
          .start-btn.pressed { animation: startPress 0.38s ease-out both; box-shadow: 0 0 30px rgba(248, 113, 113, 0.95), inset 0 0 20px rgba(255, 255, 255, 0.35); }
    @keyframes startPress {
      0% { transform: none; filter: brightness(1); }
      20% { transform: translateY(5px) scale(0.94, 0.9); filter: brightness(1.5); }
      55% { transform: translateY(-4px) scale(1.06, 1.08); filter: brightness(1.7); }
      100% { transform: translateY(0) scale(1.02); filter: brightness(1.3); }
    }
    * { touch-action: manipulation; -webkit-touch-callout: none; }
    #gameCanvas, #btnArea { touch-action: none; }
  </style>

<body>
<div class="game-container">
    <div id="gameWrapper" class="game-wrapper">
      <div class="gameboy-body">

        <div class="gb-screen-border">
          <canvas id="gameCanvas" width="240" height="160"></canvas>
        </div>

        <div class="gb-title">Beam Struggle</div>

        <div id="dpadControl" class="dpad">
          <div class="dpad-axis dpad-h"></div>
          <div class="dpad-axis dpad-v"></div>
        </div>

        <div id="btnArea" class="gb-buttons-area">
          <div class="gb-buttons">
            <div id="btnB" class="gb-btn">B</div>
            <div id="btnA" class="gb-btn">A</div>
          </div>
        </div>

        <div class="gb-menu">
          <div id="btnSelect" class="gb-menu-btn"><span class="gb-menu-label">SELECT</span></div>
          <div id="btnStart" class="gb-menu-btn"><span class="gb-menu-label">START</span></div>
        </div>

        <div class="gb-speaker">
          <div class="gb-speaker-line"></div><div class="gb-speaker-line"></div>
          <div class="gb-speaker-line"></div><div class="gb-speaker-line"></div>
        </div>

        <button id="btnMusicToggle" class="music-btn is-on">🎵 ON</button>

        <div id="setupOverlay" class="overlay">
          <h1 class="title-glow" style="font-size: 25px; margin-bottom: 4px;">BEAM STRUGGLE</h1>
          <canvas id="titleCanvas" width="206" height="50" style="width:206px;height:50px;image-rendering:pixelated;margin-bottom:12px;"></canvas>
          <p style="font-size: 11px; margin-bottom: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; letter-spacing: 1px; color: #a7f3d0;">OUT-TAP THE MONSTERS!</p>
          <p style="font-size: 10px; margin-bottom: 18px; font-family: 'Plus Jakarta Sans', sans-serif; color: #94a3b8;">A button / SPACE / TAP = MASH IT!</p>
          <div class="mode-buttons">
            <button id="btnBeamStart" class="start-btn boost-btn">START</button>
            <button id="btnBackSelect" class="start-btn" style="background:#334155;color:#e2e8f0;box-shadow:0 4px 0 #1e293b;font-size:12px;">&lt; BACK TO GAME SELECT</button>
          </div>
        </div>

      </div>
    </div>
  </div>
<script>
(()=>{
const W=240,H=160,GY=124,CX=28,DX=212,BY=GY-13,HL=CX+10,HR=DX-13;
const cv=document.getElementById('gameCanvas');let g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.floor(x),Math.floor(y),w,h)};
const disc=(c,cx,cy,r,col)=>{c.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy+r));c.fillRect(cx-w,cy+dy,w*2+1,1)}};

/* ---------- 3x5 ドット文字 ---------- */
const F={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',0:'111101101101111',1:'010110010010111',2:'110001010100111',3:'110001010001110',4:'101101111001001',5:'111100110001110',6:'011100111101111',7:'111001010010010',8:'111101111101111',9:'111101111001110','!':'010010010000010','.':'000000000000010','-':'000000111000000',':':'000010000010000','<':'001010100010001','>':'100010001010100','?':'110001010000010','/':'001001010100100'};
function T(s,x,y,c,k=1,al='c',sh='#000'){
  s=String(s).toUpperCase();const w=s.length*4*k-k;
  x=Math.floor(al==='c'?x-w/2:al==='r'?x-w:x);
  for(const [col,o] of sh?[[sh,k],[c,0]]:[[c,0]]){
    g.fillStyle=col;
    for(let i=0;i<s.length;i++){const p=F[s[i]];if(!p)continue;
      for(let j=0;j<15;j++)if(p[j]==='1')g.fillRect(x+i*4*k+(j%3)*k+o,y+((j/3)|0)*k+o,k,k)}
  }
}

/* ---------- サウンド：GCRと同じ効果音（GCRのコードをそのまま移植） ---------- */
let audioCtx=null;
function playKirarin() {
      const c = ensureAudioCtx();
      if (!c) return;
      if (c.state === 'suspended') c.resume().catch(function(){});
      const t = c.currentTime;
      [1319, 1760, 2349, 2794, 3520, 4699, 5920].forEach(function(f, i) {
        const st = t + i * 0.055;
        [['sine', f, 0.16], ['triangle', f * 2, 0.05]].forEach(function(v) {
          const o = c.createOscillator(), gn = c.createGain();
          o.type = v[0]; o.frequency.setValueAtTime(v[1], st);
          gn.gain.setValueAtTime(0.0001, st);
          gn.gain.exponentialRampToValueAtTime(v[2], st + 0.006);
          gn.gain.exponentialRampToValueAtTime(0.0001, st + (i === 6 ? 0.9 : 0.35));
          o.connect(gn); gn.connect(c.destination);
          o.start(st); o.stop(st + 1);
        });
      });
    }
function playSound(type) {
      if (!audioCtx) {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        } catch(e) {}
      }
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(function(){});
      }

      try {
        const osc = audioCtx.createOscillator(); 
        const gain = audioCtx.createGain();
        osc.connect(gain); 
        gain.connect(audioCtx.destination);
        
        if (type === 'jump') { 
          osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1); 
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
        else if (type === 'coin') { 
          osc.type = 'triangle'; osc.frequency.setValueAtTime(900, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.1); 
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
        else if (type === 'hit') { 
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); 
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime); osc.start();
          osc.stop(audioCtx.currentTime + 0.4); 
        }
        else if (type === 'deflect') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }
        else if (type === 'explosion') {
          osc.type = 'sawtooth'; 
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.8);
          
          const osc2 = audioCtx.createOscillator();
          osc2.type = 'square';
          osc2.frequency.setValueAtTime(50, audioCtx.currentTime);
          osc2.frequency.exponentialRampToValueAtTime(5, audioCtx.currentTime + 0.8);
          osc2.connect(gain);
          osc2.start(); osc2.stop(audioCtx.currentTime + 0.8);

          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
          osc.start(); osc.stop(audioCtx.currentTime + 0.8);
        }
        else if (type === 'thunder') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(850, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
          gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }
        else if (type === 'gather') { 
          osc.type = 'sine';
          osc.frequency.setValueAtTime(55, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
          osc.start(); osc.stop(audioCtx.currentTime + 0.12);
        }
        else if (type === 'glow') { 
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(45, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(65, audioCtx.currentTime + 0.9);
          osc.frequency.exponentialRampToValueAtTime(1100, audioCtx.currentTime + 1.5);
          
          const mod = audioCtx.createOscillator();
          mod.type = 'triangle';
          mod.frequency.setValueAtTime(50, audioCtx.currentTime);
          mod.frequency.linearRampToValueAtTime(5, audioCtx.currentTime + 1.5);
          mod.connect(gain);
          
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.9);
          gain.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + 1.4);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
          
          osc.start(); osc.stop(audioCtx.currentTime + 1.5);
          mod.start(); mod.stop(audioCtx.currentTime + 1.5);
        }
        else if (type === 'form') { 
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(35, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 1.0);
          
          const osc2 = audioCtx.createOscillator();
          osc2.type = 'square';
          osc2.frequency.setValueAtTime(32, audioCtx.currentTime);
          osc2.frequency.linearRampToValueAtTime(27, audioCtx.currentTime + 1.0);
          osc2.connect(gain);
          
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.8);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.0);
          
          osc.start(); osc.stop(audioCtx.currentTime + 1.0);
          osc2.start(); osc2.stop(audioCtx.currentTime + 1.0);
        }
        else if (type === 'teleport') {
          // 🌀 ビーム降下音：低い音から一気に駆け上がる「シュー」
          osc.type = 'square';
          osc.frequency.setValueAtTime(120, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + 0.32);
          gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.34);
          osc.start(); osc.stop(audioCtx.currentTime + 0.34);

          // 着地の「ボン」という短いチャイム音
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.connect(gain2); gain2.connect(audioCtx.destination);
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(900, audioCtx.currentTime + 0.3);
          osc2.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.5);
          gain2.gain.setValueAtTime(0.0001, audioCtx.currentTime);
          gain2.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.3);
          gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.55);
          osc2.start(audioCtx.currentTime + 0.3); osc2.stop(audioCtx.currentTime + 0.55);
        }
      } catch (e) {
      }

let isMusicOn=true;
const BGM_URL="../iwashiro_pareidolia.mp3";
let bgmBuffer=null,bgmSource=null,bgmGain=null,bgmLoading=false;
let leaving=false,unlockArmed=false;
let bgmWanted=false;   // タイトル画面では false。STARTで true、タイトルに戻ると false
let startPressed=false;
function ensureAudioCtx(){
  if(!audioCtx){
    const C=window.AudioContext||window.webkitAudioContext;
    if(C){
      audioCtx=new C();
      audioCtx.onstatechange=function(){
        if(audioCtx&&audioCtx.state!=='running'&&!leaving&&isMusicOn&&bgmWanted&&!document.hidden)armBgmUnlock();
      };
    }
  }
  return audioCtx;
}
function unlockAudio(){
  const c=ensureAudioCtx();
  if(!c)return;
  if(c.state!=='running'){
    try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}catch(e){}
    c.resume().catch(function(){});
  }
}
function startBgm(){
  if(!isMusicOn||leaving||!bgmWanted)return;
  const c=ensureAudioCtx();
  if(!c)return;
  if(c.state!=='running')c.resume().catch(function(){});
  if(bgmSource)return;
  if(!bgmBuffer){preloadBgm();return}
  bgmSource=c.createBufferSource();
  bgmSource.buffer=bgmBuffer;
  bgmSource.loop=true;
  bgmGain=c.createGain();
  bgmGain.gain.value=0.2;
  bgmSource.connect(bgmGain);bgmGain.connect(c.destination);
  bgmSource.start(0);
}
function stopBgm(){
  if(bgmSource){
    try{bgmSource.stop()}catch(e){}
    try{bgmSource.disconnect()}catch(e){}
    bgmSource=null;
  }
}
function stopBgmAndClose(){
  leaving=true;
  stopBgm();
  bgmLoading=false;
  const c=audioCtx;audioCtx=null;
  if(c){try{c.onstatechange=null;const pr=c.close();if(pr&&pr.catch)pr.catch(function(){})}catch(e){}}
}
function preloadBgm(){
  if(bgmBuffer||bgmLoading||leaving)return;
  const c=ensureAudioCtx();
  if(!c)return;
  bgmLoading=true;
  fetch(BGM_URL).then(function(r){return r.arrayBuffer()})
    .then(function(ab){return new Promise(function(res,rej){c.decodeAudioData(ab,res,rej)})})
    .then(function(buf){bgmBuffer=buf;bgmLoading=false;startBgm()})
    .catch(function(){bgmLoading=false});
}
function bgmOn(){bgmWanted=true;startBgm();if(!bgmSource||!audioCtx||audioCtx.state!=='running')armBgmUnlock()}
function bgmOff(){bgmWanted=false;stopBgm()}
// 「ぴょいん！」
function playBoing(){
  const c=ensureAudioCtx();
  if(!c)return;
  if(c.state!=='running')c.resume().catch(function(){});
  const t=c.currentTime,o=c.createOscillator(),gn=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(260,t);
  o.frequency.exponentialRampToValueAtTime(1100,t+0.09);
  o.frequency.exponentialRampToValueAtTime(700,t+0.16);
  o.frequency.exponentialRampToValueAtTime(980,t+0.26);
  o.frequency.exponentialRampToValueAtTime(520,t+0.42);
  lfo.frequency.value=28;lg.gain.value=40;lfo.connect(lg);lg.connect(o.frequency);
  gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(0.22,t+0.01);gn.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
  o.connect(gn);gn.connect(c.destination);
  o.start(t);o.stop(t+0.47);lfo.start(t);lfo.stop(t+0.47);
}
function armBgmUnlock(){
  if(unlockArmed||leaving)return;
  unlockArmed=true;
  const evs=['touchend','pointerup','click','keydown'];
  const h=function(){
    if(leaving)return;
    unlockAudio();
    startBgm();
    const c=audioCtx;
    if(c&&c.state==='running'&&(bgmSource||!isMusicOn||!bgmWanted)){
      evs.forEach(function(ev){window.removeEventListener(ev,h,true)});
      unlockArmed=false;
    }
  };
  evs.forEach(function(ev){window.addEventListener(ev,h,true)});
}
window.addEventListener('pagehide',function(){stopBgmAndClose()});
window.addEventListener('pageshow',function(e){
  if(e.persisted){leaving=false;unlockArmed=false;if(bgmWanted){armBgmUnlock();startBgm()}}
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){

  }else if(!leaving){
    if(audioCtx&&audioCtx.state!=='running')audioCtx.resume().catch(function(){});
    if(bgmWanted)armBgmUnlock();
  }
});

/* ---------- ビーム ---------- */
const PAL=[['#2468ff','#27a8ff','#8ef6ff'],['#c42a2a','#ff6a2a','#ffc25a']];
function bar(x1,x2,t){
  x1=Math.floor(x1);x2=Math.floor(x2);const w=x2-x1;if(w<=0)return;
  const p=PAL[t],o=(af>>2)&1,s=t?E[rd-1].s:'s';

  if(s==='t'){R(x1,BY-2,w,5,p[0]);R(x1,BY-1,w,3,p[1]);R(x1,BY,w,1,'#fff');return}
  if(s==='p'){['#ff4a4a','#ffa040','#ffee55','#6aff6a','#4ac8ff','#a06aff'].forEach((c,i)=>R(x1,BY-6+i*2,w,2,c));R(x1,BY-1,w,2,'#fff');return}

  for(let x=x1;x<x2;x+=4){const sw=Math.min(4,x2-x),k=s==='g'&&(((x>>3)+(af>>2))&1);
    const q=s==='z'?((x*7+(af>>1)*13)%7)-3:Math.round(Math.sin(x*.15+af*.25)*3);
    R(x,BY-5+q,sw,11,k?p[2]:p[0]);R(x,BY-3+q,sw,7,k?p[0]:p[1]);R(x,BY-1+q,sw,3,p[2])}
}
