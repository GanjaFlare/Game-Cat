  <script>
(()=>{
const W=240,H=160;
const cv=document.getElementById('gameCanvas');let g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.floor(x),Math.floor(y),w,h)};
const disc=(c,cx,cy,r,col)=>{c.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy+r));c.fillRect(cx-w,cy+dy,w*2+1,1)}};
/* ---------- 3x5 ドット文字 ---------- */
const F={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',0:'111101101101111',1:'010110010010111',2:'110001010100111',3:'110001010001110',4:'101101111001001',5:'111100110001110',6:'011100111101111',7:'111001010010010',8:'111101111101111',9:'111101111001110','!':'010010010000010','.':'000000000000010','-':'000000111000000',':':'000010000010000','<':'001010100010001','>':'100010001010100','?':'110001010000010','/':'001001010100100'};
function T(s,x,y,c,k=1,al='c',sh='#000'){
  s=String(s).toUpperCase();const w=s.length*4*k-k;
  x=Math.floor(al==='c'?x-w/2:al==='r'?x-w:x);
  for(const [col,o] of sh?[[sh,k],[c,0]]:[[c,0]]){
    g.fillStyle=col;
    for(let i=0;i<s.length;i++){const p=F[s[i]];if(!p)continue;
      for(let j=0;j<15;j++)if(p[j]==='1')g.fillRect(x+i*4*k+(j%3)*k+o,y+((j/3)|0)*k+o,k,k)}
  }
}

/* ---------- サウンド：GCRと同じ効果音（GCRのコードをそのまま移植） ---------- */
let audioCtx=null;
function playKirarin() {
      const c = ensureAudioCtx();
      if (!c) return;
      if (c.state === 'suspended') c.resume().catch(function(){});
      const t = c.currentTime;
      [1319, 1760, 2349, 2794, 3520, 4699, 5920].forEach(function(f, i) {
        const st = t + i * 0.055;
        [['sine', f, 0.16], ['triangle', f * 2, 0.05]].forEach(function(v) {
          const o = c.createOscillator(), gn = c.createGain();
          o.type = v[0]; o.frequency.setValueAtTime(v[1], st);
          gn.gain.setValueAtTime(0.0001, st);
          gn.gain.exponentialRampToValueAtTime(v[2], st + 0.006);
          gn.gain.exponentialRampToValueAtTime(0.0001, st + (i === 6 ? 0.9 : 0.35));
          o.connect(gn); gn.connect(c.destination);
          o.start(st); o.stop(st + 1);
        });
      });
    }
function playSound(type) {
      if (!audioCtx) {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        } catch(e) {}
      }
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(function(){});
      }

      try {
        const osc = audioCtx.createOscillator();

function drawItemPotion(cv){const c=cv.getContext('2d'),A=[9,23],B=[23,9],r=5;

  if(ov.style.display!=='none'||st==='TITLE'||st==='PODIUM')return;
  paused=!paused;confirmT=false;
  if(paused){pauseImg=g.getImageData(0,0,W,H);drawPause()}else{last=performance.now();acc=0}}
function drawPause(){
  if(!paused)return;g.putImageData(pauseImg,0,0);
  g.fillStyle='rgba(0,0,0,0.6)';g.fillRect(0,0,240,160);
  g.fillStyle='#fff';g.font="bold 22px 'Courier New'";g.textAlign='center';g.fillText('PAUSE',120,70);
  g.font="bold 9px 'Courier New'";g.fillText('START : RESUME',120,100);g.fillText('SELECT : BACK TO TITLE',120,114);
  if(confirmT){
    g.fillStyle='rgba(0,0,0,0.75)';g.fillRect(0,0,240,160);
    g.fillStyle='#0f172a';g.fillRect(30,48,180,66);g.strokeStyle='#34d399';g.lineWidth=2;g.strokeRect(30,48,180,66);
    g.textAlign='center';g.font="bold 12px 'Courier New'";
    g.fillStyle='#ffffff';g.fillText('RETURN TO TITLE?',120,74);
    g.fillStyle='#6ee7b7';g.fillText('A : YES',78,100);g.fillStyle='#fca5a5';g.fillText('B : NO',162,100)}
  g.textAlign='left'}
function onSelect(){
  if(ov.style.display!=='none')return;
  if(st==='PODIUM'){returnToTitle();return}
  if(confirmT||!paused)return;confirmT=true;drawPause()}
function answerTitleConfirm(yes){if(!confirmT)return;confirmT=false;if(yes)returnToTitle();else drawPause()}
$('btnMineStart').addEventListener('click',pressStart);$('btnMineStart').addEventListener('touchend',pressStart,{passive:false});
$('btnBackSelect').addEventListener('click',e=>{e.preventDefault();stopBgmAndClose();location.href='../'});
$('btnBackSelect').addEventListener('touchstart',e=>{e.preventDefault();stopBgmAndClose();location.href='../'},{passive:false});
$('btnSelect').addEventListener('click',onSelect);$('btnSelect').addEventListener('touchstart',e=>{e.preventDefault();onSelect()},{passive:false});
$('btnStart').addEventListener('click',togglePause);$('btnStart').addEventListener('touchstart',e=>{e.preventDefault();togglePause()},{passive:false});
[['btnA',true],['btnB',false]].forEach(a=>{const el=$(a[0]);if(!el)return;const h=e=>{if(!confirmT)return;e.preventDefault();e.stopPropagation();answerTitleConfirm(a[1])};
  el.addEventListener('mousedown',h);el.addEventListener('touchstart',h,{passive:false})});
['gameCanvas','btnArea'].forEach(id=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();act2()}));
addEventListener('keydown',e=>{
  if(confirmT){e.preventDefault();if(e.code==='KeyA'||e.code==='KeyZ')answerTitleConfirm(true);else if(e.code==='KeyB'||e.code==='KeyX'||e.code==='Escape')answerTitleConfirm(false);return}
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)act2()}
  if(e.code==='Enter'){e.preventDefault();if(!e.repeat)togglePause()}
  if(e.code==='KeyM'||e.code==='Backspace')onSelect();
});
function resizeGame(){const w=$('gameWrapper');w.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/340,innerHeight/680)+')'}
addEventListener('resize',resizeGame);resizeGame();
preloadBgm();
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
let lastTouch=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<350)e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
$('btnMusicToggle').addEventListener('click',function(){
  isMusicOn=!isMusicOn;this.innerText=isMusicOn?'🎵 ON':'🎵 OFF';this.classList.toggle('is-on',isMusicOn);
  if(isMusicOn)startBgm();else stopBgm();this.blur();
});

/* ---------- タイトル画面のミニ演出 ---------- */
const TW=200,TH=50,tg=$('titleCanvas').getContext('2d');tg.imageSmoothingEnabled=false;
let titleKs=['cat'];
function rollTitle(){titleKs=['cat',...KS.slice().sort(()=>Math.random()-.5).slice(0,2)]}rollTitle();
function drawTitle(){
  const sg=g;g=tg;R(0,0,TW,TH,'#6b4a2a');R(0,0,TW,28,'#b84a8a');R(0,27,TW,3,'#4a8a4a');
  [[titleKs[0],34],[titleKs[1],100],[titleKs[2],166]].forEach((o,i)=>{R(o[1]-16,30,32,20,'#1e1208');drawCh(o[0],o[1],44,((af+i*9)%24)<12?15:6,false)});
  g=sg;
}
let last=performance.now(),acc=0;
function loop(t){if(paused){last=t;acc=0;requestAnimationFrame(loop);return}acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){upd();acc-=1000/60}if(ov.style.display==='none')draw();else{af++;drawTitle()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
  </script>
