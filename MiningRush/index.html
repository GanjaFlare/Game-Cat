<script>
(()=>{
const W=240,H=160;
const cv=document.getElementById('gameCanvas');let g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.floor(x),Math.floor(y),w,h)};
const disc=(c,cx,cy,r,col)=>{c.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy+r));c.fillRect(cx-w,cy+dy,w*2+1,1)}};
/* ---------- 3x5 ドット文字 ---------- */
const F={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',0:'111101101101111',1:'010110010010111',2:'110001010100111',3:'110001010001110',4:'101101111001001',5:'111100110001110',6:'011100111101111',7:'111001010010010',8:'111101111101111',9:'111101111001110','!':'010010010000010','.':'000000000000010','-':'000000111000000',':':'000010000010000','<':'001010100010001','>':'100010001010100','?':'110001010000010','/':'001001010100100'};
function T(s,x,y,c,k=1,al='c',sh='#000'){
  s=String(s).toUpperCase();const w=s.length*4*k-k;
  x=Math.floor(al==='c'?x-w/2:al==='r'?x-w:x);
  for(const [col,o] of sh?[[sh,k],[c,0]]:[[c,0]]){

      for(let j=0;j<15;j++)if(p[j]==='1')g.fillRect(x+i*4*k+(j%3)*k+o,y+((j/3)|0)*k+o,k,k)}
  }
}

/* ---------- サウンド：GCRと同じ効果音（GCRのコードをそのまま移植） ---------- */
let audioCtx=null;
function playKirarin() {
      const c = ensureAudioCtx();
      if (!c) return;
      if (c.state === 'suspended') c.resume().catch(function(){});
      const t = c.currentTime;
      [1319, 1760, 2349, 2794, 3520, 4699, 5920].forEach(function(f, i) {
        const st = t + i * 0.055;

          o.start(st); o.stop(st + 1);

function playSound(type) {

          const AudioContextClass = window.AudioContext || window.webkitAudioContext;

          osc2.connect(gain);
          osc2.start(); osc2.stop(audioCtx.currentTime + 0.8);

          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
          osc.start(); osc.stop(audioCtx.currentTime + 0.8);
        }
        else if (type === 'thunder') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(850, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
          gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.start(); osc.stop(audioCtx.currentTime + 0.4);

          const osc2 = audioCtx.createOscillator();

function bossTone(type, f0, f1, dur, vol, delay) {

      if (c.state === 'suspended') c.resume().catch(function(){});
      const t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
    }
function bossNoise(dur, vol, cutoff) {

      const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);

      lp.type = 'lowpass'; lp.frequency.value = cutoff; s.buffer = buf;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(lp); lp.connect(g); g.connect(c.destination); s.start(t);
    }

let startPressed=false;
function ensureAudioCtx(){
  if(!audioCtx){
    const C=window.AudioContext||window.webkitAudioContext;
    if(C){
      audioCtx=new C();
      audioCtx.onstatechange=function(){
        if(audioCtx&&audioCtx.state!=='running'&&!leaving&&isMusicOn&&bgmWanted&&!document.hidden)armBgmUnlock();
      };
    }
  }
  return audioCtx;
}
function unlockAudio(){
  const c=ensureAudioCtx();
  if(!c)return;
  if(c.state!=='running'){
    try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}catch(e){}
    c.resume().catch(function(){});
  }
}
function startBgm(){
  if(!isMusicOn||leaving||!bgmWanted)return;
  const c=ensureAudioCtx();
  if(!c)return;
  if(c.state!=='running')c.resume().catch(function(){});
  if(bgmSource)return;
  if(!bgmBuffer){preloadBgm();return}
  bgmSource=c.createBufferSource();
  bgmSource.buffer=bgmBuffer;
  bgmSource.loop=true;
  bgmGain=c.createGain();
  bgmGain.gain.value=0.2;
  bgmSource.connect(bgmGain);bgmGain.connect(c.destination);
  bgmSource.start(0);
}
function stopBgm(){
  if(bgmSource){
    try{bgmSource.stop()}catch(e){}
    try{bgmSource.disconnect()}catch(e){}
    bgmSource=null;
  }
}
function stopBgmAndClose(){
  leaving=true;
  stopBgm();
  bgmLoading=false;
  const c=audioCtx;audioCtx=null;
  if(c){try{c.onstatechange=null;const pr=c.close();if(pr&&pr.catch)pr.catch(function(){})}catch(e){}}
}
function preloadBgm(){
  if(bgmBuffer||bgmLoading||leaving)return;
  const c=ensureAudioCtx();
  if(!c)return;
  bgmLoading=true;
  fetch(BGM_URL).then(function(r){return r.arrayBuffer()})
    .then(function(ab){return new Promise(function(res,rej){c.decodeAudioData(ab,res,rej)})})
    .then(function(buf){bgmBuffer=buf;bgmLoading=false;startBgm()})
    .catch(function(){bgmLoading=false});
}
function bgmOn(){bgmWanted=true;startBgm();if(!bgmSource||!audioCtx||audioCtx.state!=='running')armBgmUnlock()}
function bgmOff(){bgmWanted=false;stopBgm()}

function playBoing(){
  const c=ensureAudioCtx();
  if(!c)return;
  if(c.state!=='running')c.resume().catch(function(){});
  const t=c.currentTime,o=c.createOscillator(),gn=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();

  o.frequency.exponentialRampToValueAtTime(700,t+0.16);
  o.frequency.exponentialRampToValueAtTime(980,t+0.26);

  o.connect(gn);gn.connect(c.destination);

}
function armBgmUnlock(){
  if(unlockArmed||leaving)return;
  unlockArmed=true;
  const evs=['touchend','pointerup','click','keydown'];
  const h=function(){
    if(leaving)return;
    unlockAudio();
    startBgm();

    if(c&&c.state==='running'&&(bgmSource||!isMusicOn||!bgmWanted)){
      evs.forEach(function(ev){window.removeEventListener(ev,h,true)});
      unlockArmed=false;
    }
  };
  evs.forEach(function(ev){window.addEventListener(ev,h,true)});
}

});

  curses.forEach(q=>{q.t++;if(q.t===10)playSound('thunder');
    if(q.t===24)ch.forEach((o,j)=>{if(j!==q.i&&o.rk<0){o.d=Math.max(0,o.d-20);o.cu=60;pops.push({x:o.x,y:SY+o.dd*K-cam-50,t:'-20M',c:'#c6f',l:50});spark(o.x,SY+o.dd*K-cam-14,12,['#c060ff','#fff']);if(j===0)shake=10}})});
  curses=curses.filter(q=>q.t<70);
  if(st==='COUNT'){if(cd===0)playCount(cn===0);if(++cd>=(cn?50:35)){cd=0;if(--cn<0){st='PLAY';t0=af}}}
  if(st==='COUNT'||st==='PLAY'){gx+=gd*gs;if(gx>=200){gx=200;gd=-1}else if(gx<=0){gx=0;gd=1}}
  if(st==='PLAY'){ch.forEach(stepCh);if(order>0){if(goalT>0)goalT--;if(order>=3||af-firstAf>600)endGame()}}
  else if(st==='PODIUM'){
    pf++;if(pf%2===0)P.push({x:Math.random()*W,y:-3,vx:rnd(-.3,.3),vy:rnd(.6,1.2),g:0,l:220,s:2,c:pick(COL)});
    if(pf>100&&pf%24===0)firework();
  }
}

/* ---------- 描画 ---------- */
function scene(){
  const p0=ch[0];cam=Math.max(0,SY+2+p0.dd*K-85);
  let y0=(SY+1-cam)%150;if(y0>0)y0-=150;
  for(let y=y0;y<123;y+=150)g.drawImage(dt,0,Math.round(y));
  g.drawImage(bg,0,-Math.round(cam));
  LX.forEach(x=>{for(let m=10;m<100;m+=10){const y=Math.round(SY+m*K-cam);if(y>-8&&y<123){R(x-26,y,m%25?5:9,1,'#c09a62');if(m%25===0)T(m+'M',x-36,y-7,'#e8c890',1,'l')}}});
  ch.forEach(c=>c.items.forEach(o=>{if(o.got)return;const y=Math.round(SY+o.m*K-cam);if(y<-20||y>123)return;
    R(c.x-13,y-3,26,20,'#6a4a28');R(c.x-12,y-2,24,18,'#2a1a0c');
    g.save();g.translate(c.x-10,y+2);g.scale(2,2);icon(o.t,0,0);g.restore();
    if(o.t==='D'&&((af>>4)&3)===0)R(c.x+5,y,2,2,'#fff')}));
  ch.forEach((c,ci)=>{
    const y=SY+c.dd*K-cam;
    R(c.x-16,SY-cam,32,Math.round(c.dd*K)+3,'#1e1208');
    flag(c.k,c.x);drawCh(c.k,c.x,Math.round(y)+2,c.an,c.fz>0);
    if(c.cu>0&&((af>>1)&1)){g.globalAlpha=.5;R(c.x-16,y-38,32,40,'#a040ff');g.globalAlpha=1}
    {const es=[c.fz>0&&'B',curses.some(q=>q.i===ci&&q.t<50)&&'S',c.dm>0&&'D'].filter(Boolean);
     es.forEach((e,k)=>{g.save();g.translate(c.x-10-(es.length-1)*11+k*22,Math.max(0,Math.round(y)-68)+((af>>3)&1));g.scale(2,2);icon(e,0,0);g.restore()})}
    T(Math.floor(c.d)+'M',c.x-36,3,'#fff',1,'l');
  });
  curses.forEach(q=>{if(q.t<8||q.t>34)return;const a=ch[q.i],ax=a.x,ay=SY+a.dd*K-cam-60,e=Math.min(1,(q.t-8)/10);
    ch.forEach((o,j)=>{if(j===q.i)return;const bx=o.x,by=SY+o.dd*K-cam-16;
      for(let n=0;n<=60;n++){const u=n/60*e,px=ax+(bx-ax)*u,py=ay+(by-ay)*u;R(px-2,py-2,5,5,'#7a30c0');R(px-1,py-1,3,3,((n+af)&1)?'#c060ff':'#fff')}})});
  const gy=Math.round(SY+100*K+3-cam);
  if(gy<123){for(let x=0;x<W;x+=4)R(x,gy,4,2,(x>>2)&1?'#fff':'#000');T('100M',3,gy-7,'#ffee55',1,'l')}
  R(0,123,W,H-123,'#140e26');R(0,123,W,1,'#556');
  pops.forEach(p=>T(p.t,p.x,p.y,p.c));
  const p=ch[0],zE=Math.min(200,zw*(p.dm>0?1.7:1)),zr=(a,b,c)=>{const l=Math.round(Math.max(0,a)),h=Math.round(Math.min(200,b));if(h>l)R(GX+l,142,h-l,8,c)};
  R(GX-1,141,202,10,p.dm>0?'#7ef':'#556');R(GX,142,200,8,'#10182c');
  zr(zc-zE/2,zc+zE/2,'#3a8a3a');zr(zc-zE*.3,zc+zE*.3,'#e8c030');zr(zc-zE*.125,zc+zE*.125,'#ff5a3a');R(GX+Math.round(zc),142,1,8,'#fff');
  if(!(p.fz>0)){R(GX+Math.round(gx)-2,139,4,14,'#000');R(GX+Math.round(gx)-1,140,2,12,'#fff')}
  if(p.fz>0)T('BURNED! WAIT...',120,128,'#f66');
  else if(msg)T(msg.t,120,127,msg.c,2);
  if(st==='COUNT')T('PRESS A / SPACE IN THE ZONE!',120,153,'#aaa');
}
function podium(){
  ['#1a1240','#2a1b5c','#4a2a7a','#7a3a8a','#b84a8a','#e8668a','#ff9a6a','#ffc27a'].forEach((c,i)=>R(0,i*18,W,18,c));
  [[10,8],[40,20],[90,5],[150,12],[200,9],[225,24],[180,30]].forEach(p=>R(p[0],p[1],1,1,'#fff'));
  R(0,146,W,14,'#3a2a5a');
  const X=[120,72,168],TP=[100,112,120],BC=['#e8b830','#c0c8d4','#c07838'],pr=rank.indexOf(ch[0]);
  rank.forEach((c,r)=>{
    const gr=Math.min(1,Math.max(0,(pf-(2-r)*25)/20)),top=146-(146-TP[r])*gr;
    R(X[r]-20,top,40,146-top,BC[r]);R(X[r]-20,top,40,2,'#fff');
    if(gr>=1)T(String(r+1),X[r],TP[r]+8,'#000',3,'c',null);
    const jmp=r===0&&pf>120?Math.abs(Math.sin((pf-120)*.13))*14:0;
    drawCh(c.k,X[r],Math.round(top-jmp),0,false);
  });
  if(pf>60)T('YOU',X[pr],TP[pr]-60,'#ffee55');
  if(pf>80){
    T(pr===0?'YOU WIN!':'YOU: '+['1ST','2ND','3RD'][pr],120,6,pr===0&&((af>>3)&1)?'#ffd700':'#fff',3);
    if(pr===0){T('TIME '+((firstAf-t0)/60).toFixed(1)+'S',120,24,'#fff');T('BEST '+(best/60).toFixed(1)+'S',120,32,'#aaa')}
  }
  if(pf>40)T(performance.now()<lock?'WAIT...':'TAP / SPACE TO CONTINUE',120,150,performance.now()<lock?'#888':'#fff');
}
function draw(){
  g.save();if(shake>0){g.translate((Math.random()*4-2)|0,(Math.random()*4-2)|0);shake--}
  if(st==='PODIUM')podium();else scene();
  P.forEach(p=>R(p.x,p.y,p.s,p.s,p.c));
  if(flash>0){g.globalAlpha=flash/6*.7;R(0,0,W,H,'#fff');g.globalAlpha=1;flash--}
  g.restore();
  if(st==='COUNT')T(cn?cn:'GO!',120,50,cn?'#ffd700':'#6bff7a',cn?8:6);
  else if(st==='PLAY'&&goalT>0&&((af>>2)&1))T('GOAL!',120,50,'#ffd700',5);
}

/* ---------- 入力・メニュー ---------- */
function showMenu(){bgmOff();startPressed=false;$('btnMineStart').classList.remove('pressed');st='TITLE';P=[];rollTitle();ov.style.display='flex'}
function startGame(){
  if(startPressed)return;startPressed=true;
  const b=$('btnMineStart');b.classList.remove('pressed');void b.offsetWidth;b.classList.add('pressed');
  playBoing();au();bgmOn();
  setTimeout(function(){bgmOn();ov.style.display='none';newGame()},380);
}
function press(e){
  if(e&&e.preventDefault)e.preventDefault();
  if(ov.style.display!=='none'){startGame();return}
  if(st==='PLAY')act();else if(st==='PODIUM'&&performance.now()>=lock)newGame();
}
{const h=function(e){e.preventDefault();startGame()};

['gameCanvas','btnArea'].forEach(id=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();press(e)}));
